<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Herbarium — Agreement Press</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --paper:#f3ead4; --card:#fffbf2; --card-line:#e3d5b0;
      --ink:#2d2620; --ink-muted:#8c7c62;
      --forest:#2f5233; --forest-dark:#20391f; --moss:#6f8f5a;
      --clay:#b5651d; --gold:#c9a227; --rust:#a4392c;
      --verb:#2f6b3f; --wrong:#a4392c;
      --a1:#4f8f5f; --a2:#4f8f5f; --b1:#c9932a; --b2:#c9932a; --c1:#a4392c;
      --shadow-sm:0 1px 2px rgba(45,38,32,.08),0 3px 8px rgba(45,38,32,.06);
      --shadow-md:0 2px 6px rgba(45,38,32,.10),0 10px 26px rgba(45,38,32,.12);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    html,body{min-height:100%;overscroll-behavior-x:none;}
    body{
      font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
      min-height:100dvh; display:flex; flex-direction:column; align-items:center;
      background-image:
        radial-gradient(ellipse 70% 50% at 12% 8%, rgba(111,143,90,.14) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 92% 88%, rgba(181,101,29,.10) 0%, transparent 60%);
    }
    .screen{display:none;flex-direction:column;align-items:center;width:100%;min-height:100dvh;}
    .screen.active{display:flex;}
    #gameScreen{align-items:stretch;}
    .col{
      display:flex;flex-direction:column;width:100%;min-height:100%;max-width:520px;margin:0 auto;
      padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
      gap:clamp(10px,1.6dvh,16px);
    }

    /* ═══════ Name / Department Gate ═══════ */
    #nameForm{align-items:center;justify-content:center;padding:24px;gap:0;}
    .gate-card{
      width:100%;max-width:400px;background:var(--card);border:1.5px solid var(--card-line);
      border-radius:20px;padding:34px 26px 28px;box-shadow:0 20px 60px rgba(45,38,32,.14);
      display:flex;flex-direction:column;align-items:stretch;gap:14px;
      animation:cardIn .5s cubic-bezier(.34,1.4,.64,1) forwards;
    }
    .hero-quote{text-align:center;margin-bottom:8px;}
    .hero-text{font-family:'Fraunces',serif;font-weight:900;font-size:2.1rem;color:var(--forest);letter-spacing:-.5px;}
    .hero-author{font-size:1.3rem;margin-top:4px;}
    .gate-label{font-family:'Space Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin:6px 0 -6px;}
    #nameInput, #departmentSelect{
      width:100%;padding:14px 15px;border-radius:12px;border:1.5px solid var(--card-line);
      background:#fffdf7;font-family:'Inter',sans-serif;font-size:1rem;color:var(--ink);
      appearance:none;-webkit-appearance:none;
    }
    #departmentSelect{
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238c7c62' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
      background-repeat:no-repeat;background-position:right 14px center;background-size:18px;
    }
    #nameInput:focus, #departmentSelect:focus{outline:none;border-color:var(--moss);}
    #gateError{color:var(--rust);font-size:.78rem;font-family:'Space Mono',monospace;text-align:center;min-height:1em;}
    .btn-start{
      margin-top:6px;padding:15px;border:none;border-radius:12px;
      background:linear-gradient(135deg,var(--forest),var(--moss));color:#fff;
      font-family:'Inter',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.03em;
      text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(47,82,51,.25);
      transition:transform .15s;
    }
    .btn-start:active{transform:scale(.97);}

    /* Top Bar */
    .top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .top-actions{display:flex;gap:6px;}
    .icon-btn{
      width:40px;height:40px;border-radius:9px;border:1.5px solid var(--card-line);background:var(--card);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);
      box-shadow:var(--shadow-sm);transition:all .18s var(--ease);
    }
    .icon-btn svg{width:46%;height:46%;}
    .icon-btn:hover{background:#f7ede0;color:var(--rust);}
    .icon-btn:active{transform:scale(.9);}
    .brand{text-align:center;}
    .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.15rem,3.6dvh,1.55rem);letter-spacing:-.3px;color:var(--forest);}
    .brand span{color:var(--rust);}
    .brand .sub{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-top:1px;}

    .timer-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--card-line);border-radius:99px;padding:6px 14px;box-shadow:var(--shadow-sm);}
    .timer-text{font-family:'Space Mono',monospace;font-size:.85rem;font-weight:700;color:var(--forest);white-space:nowrap;}

    /* Stats Strip */
    .stat-strip{background:var(--card);border:1.5px solid var(--card-line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;}
    .stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
    .rank-name{font-family:'Fraunces',serif;font-weight:700;font-size:.86rem;color:var(--forest);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .stat-nums{font-family:'Space Mono',monospace;font-size:.66rem;color:var(--ink-muted);white-space:nowrap;}
    .stat-nums b{color:var(--clay);font-weight:700;font-size:1.05em;margin:0 2px;}
    .rank-track{height:5px;background:#e9dcbb;border-radius:99px;overflow:hidden;}
    .rank-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--forest));border-radius:99px;transition:width .6s var(--ease);}

    /* ═══════ Rule Card (replaces the tense timeline) ═══════ */
    .rule-card{background:var(--card);border:1.5px solid var(--card-line);border-radius:12px;padding:12px 16px 13px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;}
    .rule-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
    .rule-name{font-family:'Fraunces',serif;font-weight:700;font-size:.98rem;color:var(--forest);}
    .cefr-pill{font-family:'Space Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap;}
    .cefr-pill.a1,.cefr-pill.a2{background:var(--a1);}
    .cefr-pill.b1,.cefr-pill.b2{background:var(--b1);}
    .cefr-pill.c1{background:var(--c1);}
    .rule-explain{font-family:'Inter',sans-serif;font-size:.78rem;line-height:1.45;color:var(--ink-muted);}

    /* Specimen Mount */
    .mount{background:var(--card);border:1.5px solid var(--card-line);border-radius:14px;padding:22px 18px 16px;box-shadow:var(--shadow-md);position:relative;}
    .mount::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:1px dashed #d8c69a;border-radius:8px;pointer-events:none;}
    .mount.error{animation:shake .35s ease;}
    .mount.success{animation:pop .4s var(--ease);}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}

    .sentence-line{font-family:'Fraunces',serif;font-size:1.18rem;line-height:1.7;text-align:center;position:relative;z-index:1;}
    .blank-slot{
      display:inline-block;min-width:70px;padding:1px 8px;border-bottom:2.5px dashed #c9b98d;
      font-weight:700;color:var(--ink-muted);text-align:center;
    }
    .blank-slot.filled{border-bottom-style:solid;border-bottom-color:var(--verb);color:var(--verb);animation:tileIn .25s cubic-bezier(.2,1.5,.4,1);}
    @keyframes tileIn{from{transform:translateY(6px) scale(.85);opacity:0}to{transform:none;opacity:1}}
    .mount-caption{text-align:center;font-family:'Space Mono',monospace;font-size:.62rem;color:var(--ink-muted);margin-top:12px;letter-spacing:.03em;position:relative;z-index:1;}

    /* Choice Tray */
    .tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px;align-content:flex-start;}
    .tile{
      display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:11px 22px;border-radius:12px;
      background:#fffdf7;border:1.5px solid #bfe0c8;cursor:pointer;user-select:none;
      box-shadow:var(--shadow-sm);transition:transform .15s var(--ease),box-shadow .15s,opacity .15s;
      animation:tileSpawn .22s cubic-bezier(.2,1.5,.4,1);
    }
    .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
    .tile:active{transform:scale(.94);}
    .tile.wrong{animation:tileShake .4s ease;}
    .tile.solved{opacity:0;pointer-events:none;}
    @keyframes tileShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @keyframes tileSpawn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    .tile .word{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--verb);text-transform:lowercase;}

    /* Paradigm Panel */
    .paradigm-panel{
      background:var(--card);border:1.5px solid var(--card-line);border-radius:12px;padding:10px 14px 12px;
      box-shadow:var(--shadow-sm);margin-top:auto;display:flex;flex-direction:column;gap:6px;
    }
    .paradigm-title{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;}
    .paradigm-title b{color:var(--forest);}
    .paradigm-rows{display:flex;flex-direction:column;gap:4px;}
    .paradigm-row{display:flex;align-items:baseline;gap:8px;padding:4px 2px;border-radius:6px;}
    .paradigm-row.active{background:#eef3e9;}
    .paradigm-num{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--ink-muted);min-width:16px;flex-shrink:0;}
    .paradigm-row.done .paradigm-num{color:var(--forest);}
    .paradigm-sentence{font-family:'Fraunces',serif;font-size:.86rem;color:var(--ink);flex:1;}
    .paradigm-sentence.pending{color:#c9bfa5;font-style:italic;}
    .paradigm-sentence b{color:var(--verb);}
    .paradigm-check{font-size:.75rem;color:var(--moss);flex-shrink:0;}

    .archive-title{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;}
    .archive-list{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .archive-card{background:#faf5e6;border:1.5px solid #ecdfb9;border-radius:8px;padding:7px 10px;}
    .archive-card .arc-rule{font-family:'Space Mono',monospace;font-size:.56rem;color:var(--forest);text-transform:uppercase;font-weight:700;margin-bottom:3px;}
    .archive-card .arc-line{font-family:'Fraunces',serif;font-size:.78rem;color:var(--ink);line-height:1.5;}
    .archive-card .arc-line b{color:var(--verb);}

    .toast{
      position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
      padding:10px 20px;border-radius:16px;font-size:.82rem;font-weight:500;z-index:200;pointer-events:none;
      transition:transform .35s var(--ease),opacity .35s;opacity:0;max-width:90vw;text-align:center;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    .toast.good{background:linear-gradient(135deg,var(--forest),var(--moss));}
    .toast.bad{background:linear-gradient(135deg,var(--rust),#c0503f);}
    .toast b{display:block;font-family:'Fraunces',serif;font-size:.95rem;margin-bottom:2px;}

    /* End Screen */
    #endScreen{justify-content:flex-start;padding:30px 16px 50px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .end-card{
      background:var(--card);border:1.5px solid var(--card-line);border-radius:20px;padding:32px 26px;max-width:520px;
      width:100%;box-shadow:0 20px 60px rgba(45,38,32,.14);animation:cardIn .55s cubic-bezier(.34,1.4,.64,1) forwards;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
    .end-title{font-family:'Fraunces',serif;font-size:2rem;font-weight:900;text-align:center;color:var(--forest);margin-bottom:4px;}
    .end-subtitle{text-align:center;font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;}
    .end-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
    .stat-box{background:var(--paper);border-radius:12px;padding:13px 8px;text-align:center;border:1.5px solid var(--card-line);}
    .stat-num{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;color:var(--forest);line-height:1;}
    .stat-lbl{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
    .end-sentences-title{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;}
    .end-specimen-card{background:#faf5e6;border:1.5px solid #ecdfb9;border-radius:10px;padding:10px 12px;margin-bottom:8px;animation:pop-in .35s cubic-bezier(.2,1.5,.4,1) backwards;}
    .end-specimen-card .arc-rule{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--forest);text-transform:uppercase;font-weight:700;margin-bottom:4px;}
    .end-specimen-card .arc-line{font-family:'Fraunces',serif;font-size:.85rem;color:var(--ink);line-height:1.6;}
    .end-specimen-card .arc-line b{color:var(--verb);}
    @keyframes pop-in{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    .end-btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
    .btn-end{
      flex:1;padding:13px 10px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:.86rem;font-weight:700;
      letter-spacing:.03em;cursor:pointer;transition:transform .15s;text-transform:uppercase;min-width:90px;
    }
    .btn-end:hover{transform:scale(1.03);}
    .btn-end-primary{background:linear-gradient(135deg,var(--forest),var(--moss));color:#fff;box-shadow:0 4px 16px rgba(47,82,51,.25);}
    .btn-end-share{background:linear-gradient(135deg,#128c7e,#25d366);color:#fff;}
  </style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ═══════ Name / Department Gate ═══════ -->
<div class="screen active" id="nameForm">
  <div class="gate-card">
    <div class="hero-quote">
      <div class="hero-text">Win-Win</div>
      <div class="hero-author">🤗♥️✨</div>
    </div>
    <div class="gate-label">Your Name</div>
    <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off"/>
    <div class="gate-label">Department</div>
    <select id="departmentSelect">
      <option value="">-- Select Department --</option>
      <option value="Cyber Security">Cyber Security</option>
      <option value="EIE">EIE</option>
      <option value="CSE-1">CSE-1</option>
      <option value="CSE-2">CSE-2</option>
      <option value="CSE-3">CSE-3</option>
      <option value="Mechanical Engineering">Mechanical Engineering</option>
      <option value="ECE-1">ECE-1</option>
      <option value="ECE-2">ECE-2</option>
      <option value="ECE-3">ECE-3</option>
      <option value="AI DS-1">AI DS-1</option>
      <option value="AI DS-2">AI DS-2</option>
      <option value="Agri and Civil">Agri and Civil</option>
      <option value="EEE">EEE</option>
      <option value="Medical Electronics">Medical Electronics</option>
      <option value="IT-1">IT-1</option>
      <option value="IT-2">IT-2</option>
    </select>
    <div id="gateError"></div>
    <button class="btn-start" onclick="beginQuiz()">✿ Start Quiz</button>
  </div>
</div>

<div class="screen" id="gameScreen">
  <div class="col">
    <div class="top-bar">
      <div class="top-actions">
        <button class="icon-btn" id="btn-end-game" aria-label="End round">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 4h11l-2 3.5L16 11H5"/></svg>
        </button>
        <button class="icon-btn" id="btn-new" aria-label="New round">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
        </button>
      </div>
      <div class="brand"><h1>Herbari<span>✿</span>m</h1><div class="sub">Agreement Press</div></div>
      <div class="timer-pill">
        <div class="timer-text" id="timerText">00:00</div>
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat-top">
        <span class="rank-name" id="rank-name">Seed 🌰</span>
        <span class="stat-nums"><b id="score">0</b>pts · <b id="streak">0</b> streak · best <b id="best-score">0</b></span>
      </div>
      <div class="rank-track"><div class="rank-fill" id="rank-fill" style="width:0%"></div></div>
    </div>

    <!-- Rule Card — replaces the tense timeline; teaches the rule before drilling it -->
    <div class="rule-card">
      <div class="rule-card-top">
        <span class="rule-name" id="rule-name">Rule name</span>
        <span class="cefr-pill" id="cefr-pill">A1</span>
      </div>
      <div class="rule-explain" id="rule-explain">Explanation goes here.</div>
    </div>

    <div class="mount" id="mount">
      <div class="sentence-line" id="sentence-line"></div>
      <div class="mount-caption" id="mount-caption">tap the correct verb form</div>
    </div>

    <div class="tray" id="tray"></div>

    <!-- Paradigm panel: all 4 sentences of the current rule group -->
    <div class="paradigm-panel">
      <div class="paradigm-title">Rule <b id="specimen-num">1</b>/24 · <b id="paradigm-count">0</b>/4 sentences</div>
      <div class="paradigm-rows" id="paradigm-rows"></div>
      <div class="archive-title" id="archive-title" style="display:none;">Earlier rules</div>
      <div class="archive-list" id="archive-list"></div>
    </div>
  </div>
</div>

<div class="screen" id="endScreen">
  <div class="end-card">
    <div class="end-title" id="endTitle">🌿 Collection Closed</div>
    <div class="end-subtitle" id="endSubtitle">Herbarium · Agreement Press</div>
    <div class="end-stats">
      <div class="stat-box"><div class="stat-num" id="endScore">0</div><div class="stat-lbl">Score</div></div>
      <div class="stat-box"><div class="stat-num" id="endSentences">0</div><div class="stat-lbl">Pressed</div></div>
      <div class="stat-box"><div class="stat-num" id="endAccuracy">0%</div><div class="stat-lbl">Accuracy</div></div>
    </div>
    <div class="end-sentences-title">Your Specimens</div>
    <div id="endSentencesList"></div>
    <div class="end-btn-row">
      <button class="btn-end btn-end-primary" id="btnPlayAgain">✿ Play Again</button>
      <button class="btn-end btn-end-share" id="btnShare">📲 Share</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   RULE DATA — 24 subject-verb-agreement rule groups, CEFR-tagged,
   each with a one-line "why" explanation and 4 practice sentences.
   Every sentence has exactly one blank and exactly 2 verb choices:
   the correct form + the classic ESL error for that rule.
   ═══════════════════════════════════════════════════════════════ */
const RULE_GROUPS = [
  {
    name: "3rd-Person Singular -s", cefr: "a1",
    explain: "Singular subjects (he/she/it, and singular names) take the -s verb form in the present simple. Plural subjects, and 'I'/'you', take the base form.",
    items: [
      { before:"Minerva", after:"to the market every morning.", answer:"goes", choices:["goes","go"] },
      { before:"Albus and Severus", after:"to the market every morning.", answer:"go", choices:["go","goes"] },
      { before:"They", after:"to the market every morning.", answer:"go", choices:["go","goes"] },
      { before:"You", after:"to the market every morning.", answer:"go", choices:["go","goes"] }
    ]
  },
  {
    name: "Collective Nouns as a Unit", cefr: "b1",
    explain: "Collective nouns (team, committee, family) take a singular verb when acting as one group. Words for the individual members (players, people) take a plural verb.",
    items: [
      { before:"The team", after:"practising every day this week.", answer:"is", choices:["is","are"] },
      { before:"The committee", after:"practising every day this week.", answer:"is", choices:["is","are"] },
      { before:"The players", after:"practising every day this week.", answer:"are", choices:["are","is"] },
      { before:"They", after:"practising every day this week.", answer:"are", choices:["are","is"] }
    ]

const CEFR_LABEL = {a1:"A1",a2:"A2",b1:"B1",b2:"B2",c1:"C1"};
const CEFR_POINTS = {a1:8,a2:9,b1:10,b2:13,c1:16};

const TOTAL_RULES = RULE_GROUPS.length;

const RANKS = [
  {name:'Seed 🌰',min:0},{name:'Sprout 🌱',min:60},{name:'Bud 🌿',min:160},
  {name:'Bloom 🌸',min:320},{name:'Specimen 🗒️',min:520},{name:'Botanist ✿',min:760}
];

const BEST_KEY = 'herbariumAgreementBest';

// ═══════ Supabase logging (edge function) ═══════
const EDGE_FUNCTION_URL = "https://yellow-lab-4999.andrewveda.workers.dev/functions/v1/logQuest";
const QUEST_ID = "Herbarium Agreement Press";

let playerName = '';
let playerDept = '';

let deck = [];
let currentGroup = null;
let currentItemIndex = 0;
let current = null;           // active item {before, after, answer, choices}
let currentTiles = [];        // shuffled choice tiles for this item

let placedCount = 0;          // 0 or 1 — whether the current blank is filled
let currentMistakes = 0;

let score = 0, streak = 0, completedCount = 0, correctTaps = 0, wrongTaps = 0;
let sentenceStart = 0;
let completedList = [];       // flat log for share/end screen
let ruleArchive = [];         // [{name, forms:[{text}]}] completed rule groups
let currentForms = [];        // sentences completed so far in the group in progress
let bestScore = parseInt(localStorage.getItem(BEST_KEY) || '0');

let elapsedSeconds = 0;
let timerInterval = null;
let gameActive = true;

/* ═══════════════ NAME GATE ═══════════════ */
function beginQuiz(){
  const nameEl = document.getElementById('nameInput');
  const deptEl = document.getElementById('departmentSelect');
  const errEl = document.getElementById('gateError');
  const name = nameEl.value.trim();
  const dept = deptEl.value;

  if(!name){ errEl.textContent = 'Please enter your name.'; nameEl.focus(); return; }
  if(!dept){ errEl.textContent = 'Please select your department.'; deptEl.focus(); return; }

  errEl.textContent = '';
  playerName = name;
  playerDept = dept;

  document.getElementById('nameForm').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  newGame();
}

function shuffledDeck(){
  const idx = RULE_GROUPS.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  return idx;
}

function newGame(){
  clearInterval(timerInterval);
  deck = shuffledDeck();
  score=0; streak=0; completedCount=0; correctTaps=0; wrongTaps=0;
  completedList=[]; ruleArchive=[]; elapsedSeconds=0; gameActive=true;
  updateStats(); renderArchive();
  loadNextRuleGroup();
  updateTimerDisplay();
  startStopwatch();
}

function loadNextRuleGroup(){
  if(!deck.length) return;
  const i = deck.pop();
  currentGroup = RULE_GROUPS[i];
  currentItemIndex = 0;
  currentForms = [];
  renderRuleCard();
  applyItemData();
  renderParadigm();
}

function renderRuleCard(){
  document.getElementById('rule-name').textContent = currentGroup.name;
  const pill = document.getElementById('cefr-pill');
  pill.textContent = CEFR_LABEL[currentGroup.cefr];
  pill.className = 'cefr-pill ' + currentGroup.cefr;
  document.getElementById('rule-explain').textContent = currentGroup.explain;
}

/* ═══════════════ ITEM (single blank) LOGIC ═══════════════ */
function applyItemData(){
  current = currentGroup.items[currentItemIndex];
  placedCount = 0; currentMistakes = 0;
  sentenceStart = Date.now();

  currentTiles = current.choices.map((c,i)=>({id:i+'-'+Date.now(), text:c, correct:c===current.answer, solved:false}));
  shuffleArray(currentTiles);

  renderSentence(); renderTray();
  document.getElementById('mount-caption').textContent = 'tap the correct verb form';
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

/* ═══════════════ STOPWATCH ═══════════════ */
function startStopwatch(){
  timerInterval = setInterval(()=>{
    if(!gameActive) return;
    elapsedSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay(){
  const m = Math.floor(elapsedSeconds / 60);
  const s = elapsedSeconds % 60;
  document.getElementById('timerText').textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

/* ═══════════════ RENDER ═══════════════ */
function renderSentence(){
  const el = document.getElementById('sentence-line');
  const blankHTML = placedCount
    ? `<span class="blank-slot filled">${current.answer}</span>`
    : `<span class="blank-slot">____</span>`;
  el.innerHTML = `${current.before} ${blankHTML} ${current.after}`;
}

function renderTray(){
  const wrap=document.getElementById('tray'); wrap.innerHTML='';
  currentTiles.forEach(t=>{
    const el=document.createElement('div');
    el.className='tile'+(t.solved?' solved':'');
    el.innerHTML = `<span class="word">${t.text}</span>`;
    el.onclick = ()=>tapTile(t.id, el);
    wrap.appendChild(el);
  });
}

/* ═══════════════ GAMEPLAY ═══════════════ */
function tapTile(id, el){
  if(!gameActive || placedCount) return;
  const tile = currentTiles.find(t=>t.id===id);
  if(!tile) return;

  if(tile.correct){
    tile.solved = true;
    placedCount = 1;
    correctTaps++;
    renderSentence();
    currentTiles.forEach(t=>{ if(!t.solved) t.solved = true; });
    renderTray();
    document.getElementById('mount').classList.remove('error');
    completeItem();
  } else {
    wrongTaps++; currentMistakes++; streak = 0;
    el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'),400);
    document.getElementById('mount').classList.add('error');
    setTimeout(()=>document.getElementById('mount').classList.remove('error'),350);
    updateStats();
    if(navigator.vibrate) navigator.vibrate(15);
  }
}

function completeItem(){
  const elapsedSec = (Date.now()-sentenceStart)/1000;
  const base = CEFR_POINTS[currentGroup.cefr];
  const speedBonus = Math.max(0, Math.round(8 - elapsedSec));
  const penalty = currentMistakes*3;
  const pts = Math.max(4, base+speedBonus-penalty);

  score += pts; completedCount++;
  if(currentMistakes===0) streak++; else streak=0;

  const text = current.before+' '+current.answer+' '+current.after;
  completedList.push({text, pts, rule: currentGroup.name});
  currentForms.push({text, answer: current.answer});

  updateStats(); renderParadigm();

  document.getElementById('mount').classList.add('success');
  setTimeout(()=>document.getElementById('mount').classList.remove('success'),650);

  let msg = `<b>+${pts} pts</b>${currentGroup.name}`;
  if(streak>=3) msg = `<b>🔥 ${streak} streak! +${pts} pts</b>${currentGroup.name}`;
  showToast(msg,'good',true);

  if(navigator.vibrate) navigator.vibrate(streak>=3?[20,40,20]:18);

  setTimeout(()=>{
    if(!gameActive) return;
    if(currentItemIndex < currentGroup.items.length - 1){
      currentItemIndex++;
      applyItemData();
      renderParadigm();
    } else {
      ruleArchive.push({ name: currentGroup.name, forms: currentForms.slice() });
      renderArchive();

      if (ruleArchive.length >= TOTAL_RULES) {
        showToast('🌿 Collection Complete! 24/24 rules pressed', 'good');
        setTimeout(endGame, 1400);
      } else {
        showToast('🌿 Rule Mastered!', 'good');
        loadNextRuleGroup();
      }
    }
  }, 700);
}

/* ═══════════════ PARADIGM PANEL ═══════════════ */
function renderParadigm(){
  const rows = document.getElementById('paradigm-rows');
  rows.innerHTML = '';
  currentGroup.items.forEach((item, idx) => {
    const found = currentForms[idx];
    const row = document.createElement('div');
    row.className = 'paradigm-row' + (found ? ' done' : (idx === currentItemIndex ? ' active' : ''));
    const num = `<span class="paradigm-num">${idx+1}</span>`;
    const sentence = found
      ? `<span class="paradigm-sentence">${item.before} <b>${found.answer}</b> ${item.after}</span><span class="paradigm-check">✓</span>`
      : `<span class="paradigm-sentence pending">— not pressed yet —</span>`;
    row.innerHTML = num + sentence;
    rows.appendChild(row);
  });
  document.getElementById('paradigm-count').textContent = currentForms.length;
  document.getElementById('specimen-num').textContent = ruleArchive.length + 1;
}

function renderArchive(){
  const title = document.getElementById('archive-title');
  const list = document.getElementById('archive-list');
  list.innerHTML = '';
  if(!ruleArchive.length){ title.style.display='none'; return; }
  title.style.display='block';
  ruleArchive.slice().reverse().forEach(rule=>{
    const card = document.createElement('div');
    card.className = 'archive-card';
    card.innerHTML = `<div class="arc-rule">${rule.name}</div>` +
      rule.forms.map(f=>`<div class="arc-line">${f.text}</div>`).join('');
    list.appendChild(card);
  });
}

/* ═══════════════ STATS / RANK ═══════════════ */
function getRank(pts){
  let r=RANKS[0];
  for(const rk of RANKS) if(pts>=rk.min) r=rk;
  return r;
}

function updateStats(){
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  if(score>bestScore){ bestScore=score; localStorage.setItem(BEST_KEY,bestScore); }
  document.getElementById('best-score').textContent=bestScore;

  const rank=getRank(score);
  const idx=RANKS.indexOf(rank), next=RANKS[idx+1];
  document.getElementById('rank-name').textContent=rank.name;

  const fill=document.getElementById('rank-fill');
  fill.style.width = next ? Math.min(100,((score-rank.min)/(next.min-rank.min))*100)+'%' : '100%';
}

/* ═══════════════ TOAST ═══════════════ */
let toastTimer;
function showToast(msg,type='',isHTML=false){
  const t=document.getElementById('toast');
  if(isHTML){ t.innerHTML=msg; } else { t.textContent=msg; }
  t.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ═══════════════ CONTROLS ═══════════════ */
document.getElementById('btn-new').addEventListener('click',()=>{
  if(confirm('Start a new round? Current progress will be lost.')) newGame();
});
document.getElementById('btn-end-game').addEventListener('click',()=>{
  if(confirm('End the round and see results?')) endGame();
});

/* ═══════════════ SUPABASE LOGGING ═══════════════ */
async function sendViaEdgeFunction(payload) {
  try {
    const response = await fetch(EDGE_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!response.ok) { console.error("❌ Edge Function Error:", await response.text()); return; }
    console.log("✅ Saved to Supabase");
  } catch (err) { console.error("⚠️ Edge Function Error:", err); }
}

function submitScoreToSupabase(finalScore, totalSeconds, totalCompleted){
  const payload = {
    student_name: playerName,
    department: playerDept,
    correct: correctTaps,
    wrong: wrongTaps,
    time_spent: totalSeconds,
    quest_id: QUEST_ID,
    score: finalScore,
    sentences_pressed: totalCompleted
  };
  sendViaEdgeFunction(payload);
}

/* ═══════════════ END GAME ═══════════════ */
function endGame(){
  gameActive=false;
  clearInterval(timerInterval);
  submitScoreToSupabase(score, elapsedSeconds, completedCount);
  setTimeout(showEndScreen,250);
}

function showEndScreen(){
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('endScreen').classList.add('active');

  const tm=[[520,'✿ Botanist!'],[320,'🗒️ Specimen Master'],[160,'🌸 In Full Bloom'],[60,'🌿 Budding Talent'],[0,'🌱 Nice Sprout']];
  document.getElementById('endTitle').textContent=(tm.find(([m])=>score>=m)||tm[tm.length-1])[1];
  document.getElementById('endSubtitle').textContent=`${playerName} · ${playerDept} · ${getRank(score).name}`;
  document.getElementById('endScore').textContent=score;
  document.getElementById('endSentences').textContent=completedCount;

  const totalTaps = correctTaps+wrongTaps;
  document.getElementById('endAccuracy').textContent = totalTaps ? Math.round(correctTaps/totalTaps*100)+'%' : '100%';

  const list=document.getElementById('endSentencesList');
  list.innerHTML='';
  const rulesToShow = ruleArchive.slice();
  if(currentForms.length){
    rulesToShow.push({ name: currentGroup.name, forms: currentForms.slice() });
  }

  if(!rulesToShow.length){
    list.innerHTML='<span style="color:var(--ink-muted);font-size:.9rem;">No specimens pressed this round.</span>';
  } else {
    rulesToShow.slice().reverse().forEach((rule,i)=>{
      const div=document.createElement('div');
      div.className='end-specimen-card';
      div.style.animationDelay=(i*0.06)+'s';
      div.innerHTML = `<div class="arc-rule">${rule.name}</div>` +
        rule.forms.map(f=>`<div class="arc-line">${f.text}</div>`).join('');
      list.appendChild(div);
    });
  }

  document.getElementById('btnPlayAgain').onclick=()=>{
    document.getElementById('endScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    newGame();
  };
  document.getElementById('btnShare').onclick=shareResult;
}

function shareResult(){
  const top = completedList.slice().sort((a,b)=>b.pts-a.pts).slice(0,3).map(s=>`"${s.text}" (+${s.pts}) [${s.rule}]`).join('\n');
  const msg=`🌿 Herbarium — Agreement Press\n${playerName} (${playerDept})\nScore: ${score} pts · Time: ${document.getElementById('timerText').textContent} · ${completedCount} sentences · ${getRank(score).name}\n${top?'\nTop specimens:\n'+top+'\n':''}\nPress your own sentences!`;
  if(navigator.share){
    navigator.share({title:'Herbarium — Agreement Press',text:msg}).catch(()=>{});
  } else {
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
  }
}
</script>
