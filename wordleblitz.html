<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wordle Blitz ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080e1a;--card:#0d1525;--sf:#111e30;--tx:#e8f0fe;--mu:#7a93b8;--ab:#2a2d35;--pr:#c8920a;--co:#1e8a4a;--dg:#e53935;--ac:#00c6ff;--gd:#ffd700;--g:8px;
 --t:max(28px,min(calc((100dvh - 340px - 5*var(--g))/6),calc((100vw - 24px - 4*var(--g))/5)));font-family:'Nunito',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx)}
button,input,select{font-family:inherit}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;padding:10px;overflow-y:auto}
.scr.on{display:flex}
.scr{z-index:10}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,198,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,198,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#pc{z-index:1}#fx1{z-index:60}#cf{z-index:61}
.card{background:var(--card);border:1px solid rgba(0,198,255,.15);border-radius:24px;padding:32px 28px;width:100%;max-width:480px;margin:auto;text-align:center}
.logo,.brand{font:700 clamp(2rem,6vw,3rem) 'Rajdhani',sans-serif;letter-spacing:2px;background:linear-gradient(135deg,#00c6ff,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mu);margin:4px 0 16px}
.rule{display:flex;gap:10px;margin:8px 0;text-align:left;color:#bcd3ef;font-size:.95rem}
.rule b{margin-left:auto;color:var(--ac);white-space:nowrap}
.form input[type=text],.form select{width:100%;padding:12px 14px;margin-top:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:var(--sf);color:var(--tx);font-size:15px;font-weight:600}
#err{color:var(--dg);min-height:1.3em;margin-top:6px;font-size:.9rem}
.btn{padding:14px;border:0;border-radius:12px;font:700 1.1rem 'Rajdhani',sans-serif;letter-spacing:1px;cursor:pointer;color:#fff;background:var(--sf)}
.btn:disabled{opacity:.6}
.go{background:linear-gradient(135deg,#1e8a4a,#00c6ff);font-size:1.5rem;width:100%;margin-top:14px}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}

/* game */
#game{gap:8px;padding:8px;justify-content:flex-start}
.brand,.log{display:none}
.hud{display:flex;align-items:center;gap:14px;width:100%;max-width:460px;background:var(--card);border-radius:16px;padding:8px 16px;--arc:54px}
.arcw{position:relative;width:var(--arc);height:var(--arc);flex:none}
.arcw svg{width:100%;height:100%;transform:rotate(-90deg)}
#tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 calc(var(--arc)*.3) 'Rajdhani',sans-serif}
.hud.warn #tt{color:#ff8f00}.hud.low #tt{color:var(--dg)}
.sc{flex:1}.wn{text-align:right}
.hud small{display:block;font-size:.7rem;color:var(--mu)}
.hud b{font:700 1.6rem 'Rajdhani',sans-serif;color:var(--gd);line-height:1}
.wn b{color:#ff8f00}
.hud i{display:block;font-style:normal;font-size:.8rem;color:var(--mu);margin-top:2px}
.bw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
.board{display:grid;grid-template-rows:repeat(6,var(--t));gap:var(--g)}
.row{display:grid;grid-template-columns:repeat(5,var(--t));gap:var(--g)}
.row.act{filter:drop-shadow(0 0 8px rgba(0,198,255,.4))}
.tile{width:var(--t);height:var(--t);display:flex;align-items:center;justify-content:center;font:700 calc(var(--t)*.55) 'Rajdhani',sans-serif;text-transform:uppercase;border-radius:12px;background:#0e1928;border:1px solid rgba(255,255,255,.08)}
.tile.c{background:var(--co);border-color:transparent}.tile.p{background:var(--pr);border-color:transparent}.tile.a{background:var(--ab);border-color:transparent}
.tile.pop{animation:pop .15s}.tile.flip{animation:flip .3s}.tile.shake{animation:shake .4s;background:#2a1010}.tile.jump{animation:jump .5s}
@keyframes pop{50%{transform:scale(1.15)}}@keyframes flip{50%{transform:rotateX(-90deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes jump{40%{transform:translateY(-14px)}}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:460px}
.kr{display:flex;gap:5px}
.key{flex:1;min-width:0;height:46px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:#2e4a6e;color:#fff;font:700 clamp(1rem,3.2vw,1.4rem) 'Rajdhani',sans-serif;cursor:pointer;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.wide{flex:1.5;font-size:.95rem}.key.en{background:#1a7a42}.key.bk{background:#9b1c1c}.sp{flex:.5}
.key.c{background:var(--co)}.key.p{background:var(--pr)}.key.a{background:#1a1f2b;color:#8896ad;border-color:transparent}
.bar{display:flex;align-items:center;gap:8px;width:100%;max-width:460px;min-height:30px}
#hint{flex:1;text-align:center;font-size:.9rem;color:#9fb7db}
#skip{background:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--mu);padding:6px 12px;cursor:pointer}
#flash{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:30;background:rgba(8,14,26,.82)}
#flash.on{display:flex}
#fw{font:700 3.5rem 'Rajdhani',sans-serif;letter-spacing:4px;color:var(--gd)}#fp{font:700 2rem 'Rajdhani',sans-serif;color:var(--ac)}
#flash.bad #fw,#flash.bad #fp{color:#ff6b6b}
.bonus{position:fixed;top:90px;left:50%;font:700 2rem 'Rajdhani',sans-serif;color:#00e676;z-index:40;pointer-events:none;animation:fly 1s forwards}
@keyframes fly{to{opacity:0;transform:translateY(-50px)}}

/* desktop: left panel + huge board on the right */
@media (min-width:900px) and (min-height:560px){
 :root{--g:10px;--t:min(calc((100vh - 32px - 5*var(--g))/6),calc((54vw - 4*var(--g))/5))}
 #game.on{display:grid;grid-template-columns:minmax(0,1fr) calc(5*var(--t) + 4*var(--g) + 24px);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"b w" "h w" "l w" "k w" "r w";gap:14px 24px;padding:16px;overflow:hidden;align-items:stretch}
 .brand{display:block;grid-area:b;text-align:center;line-height:1}
 .hud{grid-area:h;--arc:clamp(120px,21vh,210px);gap:28px;padding:14px 28px}
 .hud small{font-size:.85rem}.hud b{font-size:clamp(2.2rem,6vh,3.6rem)}.hud i{font-size:1rem}
 .log{grid-area:l;display:block;overflow-y:auto;min-height:0;padding:0 12px 8px;background:var(--card);border-radius:16px}
 .kb{grid-area:k;gap:10px}.kr{gap:8px}
 .key{height:clamp(58px,9vh,92px);font-size:clamp(1.5rem,2.4vw,2.2rem);border-radius:12px}.key.wide{font-size:clamp(1rem,1.5vw,1.4rem)}
 .bar{grid-area:r}#hint{font-size:15px}
 .bw{grid-area:w;padding:12px}
 .brand,.hud,.log,.kb,.bar{width:100%;max-width:800px;justify-self:center}
 .tile{border-radius:14px}
 #flash{inset:0 auto 0 0;width:calc(100vw - 5*var(--t) - 4*var(--g) - 60px)}
 .bonus{left:240px;top:150px}
}
.lt{position:sticky;top:0;background:var(--card);padding:10px 0 8px;font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.lr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:8px 12px;margin-bottom:6px;border-radius:10px;background:var(--sf);border-left:4px solid var(--co)}
.lr.bad{border-left-color:var(--dg)}
.lr b{font:700 1.5rem 'Rajdhani',sans-serif;letter-spacing:2px}.lr span{color:var(--mu);font-size:.85rem}
.lr em{font:700 1.3rem 'Rajdhani',sans-serif;color:var(--gd);font-style:normal}.lr.bad em{color:var(--dg)}
.lr small{grid-column:1/-1;font:600 .85rem 'Rajdhani',sans-serif;letter-spacing:1.5px;color:#9fb7db}

/* end */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--sf);border-radius:12px;padding:12px 6px}
.stats b{display:block;font:700 2rem 'Rajdhani',sans-serif;color:var(--ac)}.stats span{font-size:.7rem;color:var(--mu);text-transform:uppercase}
#who{font:700 1.3rem 'Rajdhani',sans-serif;color:var(--gd)}
.wl{text-align:left;margin:14px 0}
.we{display:flex;gap:12px;align-items:center;padding:10px 14px;margin-bottom:6px;border-radius:10px;background:var(--sf)}
.we b{font:700 1.3rem 'Rajdhani',sans-serif;letter-spacing:2px;min-width:70px}.we span{flex:1;line-height:1.2;font-size:.9rem}.we em{font:700 1.1rem 'Rajdhani',sans-serif;color:var(--gd);font-style:normal}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btns .go{grid-column:1/-1;margin:0}
.wa{background:linear-gradient(135deg,#128c7e,#25d366)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="pc" class="fx"></canvas><canvas id="fx1" class="fx"></canvas><canvas id="cf" class="fx"></canvas><canvas id="stc" style="display:none"></canvas>

<div class="scr on" id="intro"><div class="card">
  <div class="logo">⚡ WORDLE BLITZ</div><div class="sub">Speed round · 5 minutes</div>
  <div class="rule">⏱️ Solve as many words as you can <b>5:00</b></div>
  <div class="rule">🎯 Fewer guesses, more points <b>1 try = 6 pts</b></div>
  <div class="rule">⚡ Solve fast for a speed bonus <b>+3 pts under 20s</b></div>
  <div class="rule">⏰ Fewer guesses, more time back <b>+15s on 1 try</b></div>
  <div class="form">
    <input id="nm" type="text" placeholder="Your name" maxlength="40" autocomplete="name"/>
    <select id="dp"><option value="">-- Select department --</option></select>
    <div id="err" role="alert"></div>
  </div>
  <button class="btn go" id="start" disabled>Loading words…</button>
</div></div>

<div class="scr" id="game">
  <div class="brand">⚡ WORDLE BLITZ</div>
  <div class="hud" id="hud">
    <div class="arcw"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/><circle id="arc" cx="27" cy="27" r="22" fill="none" stroke="#00c6ff" stroke-width="5" stroke-dasharray="138.2" stroke-dashoffset="0" stroke-linecap="round" style="transition:stroke-dashoffset 1s linear"/></svg><div id="tt">5:00</div></div>
    <div class="sc"><small>Score</small><b id="sv">0</b><i id="wv">0 solved</i></div>
    <div class="wn"><small>Word #</small><b id="wn">1</b><i id="wtm"></i></div>
  </div>
  <div class="bw"><div class="board" id="board"></div></div>
  <div class="log" id="log"></div>
  <div class="kb" id="kb"></div>
  <div class="bar"><div id="hint" role="status" aria-live="polite"></div><button type="button" id="skip">⏭ Skip</button></div>
  <div id="flash"><div id="fw"></div><div id="fp"></div></div>
</div>

<div class="scr" id="end"><div class="card">
  <div class="logo" id="et">⏱️ TIME'S UP!</div>
  <div id="who"></div>
  <div class="stats"><div><b id="es">0</b><span>Score</span></div><div><b id="ew">0</b><span>Words</span></div><div><b id="ea">–</b><span>Avg tries</span></div></div>
  <div class="wl" id="wl"></div>
  <div class="btns">
    <button class="btn go" id="again">⚡ Play Again</button>
    <button class="btn wa" id="share">📲 WhatsApp</button>
    <button class="btn" id="rep">📄 Report</button>
    <button class="btn" id="lb">🏆 Leaderboard</button>
  </div>
</div></div>

<script>
const EDGE="https://yellow-lab-4999.andrewveda.workers.dev/functions/v1/submit-quest";
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5Z6lmXH4jxHYMKUcimj_M-IV1pwtBUF72YKJIi_BO-KD_NYwWBJBQqni7m4NmQyU9NMdve4vGZ7rh/pub?gid=0&single=true&output=csv';
const NK="questPlayerName",DK="questPlayerDept",TOTAL=300,ARC=138.2,SITE='https://andrewveda.com/verve/buttons/wordle-hub';
const DEPTS=['Friends and Family','Cyber Security','EIE','CSE-1','CSE-2','CSE-3','Mechanical Engineering','ECE-1','ECE-2','ECE-3','AI DS-1','AI DS-2','Agri and Civil','EEE','Medical Electronics','IT-1','IT-2'];
const $=id=>document.getElementById(id);
let W=[],WS=new Set(),Q=[],on=false,busy=false,iv,tl=TOTAL,sc=0,solved=0,att=0,t0=0,g0=0,cur='',gs=[],inp='',log=[],tot=0,perf=0,fast=999,tb=0,best=0,str=0,skipArm=0,fin=null;
const wt=()=>Math.round((Date.now()-t0)/1000);
const show=id=>['intro','game','end'].forEach(s=>$(s).classList.toggle('on',s===id));

/* word list */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
fetch(CSV).then(r=>r.text()).then(t=>{
  W=[...new Set(t.split(/\r?\n/).map(l=>l.split(/,|\t/)[0].trim().toLowerCase()))].filter(w=>/^[a-z]{5}$/.test(w));WS=new Set(W);
  if(!W.length)throw 0;$('start').disabled=false;$('start').textContent='⚡ START BLITZ';
}).catch(()=>{$('start').textContent='⚠️ Word list failed to load'});

/* intro form */
DEPTS.forEach(d=>$('dp').add(new Option(d,d)));
try{$('nm').value=localStorage.getItem(NK)||'';$('dp').value=localStorage.getItem(DK)||''}catch(e){}
$('start').onclick=()=>{
  const n=$('nm').value.trim(),d=$('dp').value;
  if(!n||!d){$('err').textContent=n?'Please pick your department':'Please enter your name';(n?$('dp'):$('nm')).focus();return}
  try{localStorage.setItem(NK,n);localStorage.setItem(DK,d)}catch(e){}
  $('err').textContent='';startGame();
};

/* board + keyboard */
function buildBoard(){const b=$('board');b.innerHTML='';for(let r=0;r<6;r++){const row=document.createElement('div');row.className='row';for(let c=0;c<5;c++){const t=document.createElement('div');t.className='tile';row.append(t)}b.append(row)}act()}
const act=()=>[...$('board').children].forEach((r,i)=>r.classList.toggle('act',i===gs.length));
function mk(label,val,cls=''){const k=document.createElement('button');k.type='button';k.tabIndex=-1;k.className='key '+cls;k.textContent=label;k.dataset.k=val;k.setAttribute('aria-label',val);k.onclick=()=>{k.blur();press(val)};return k}
function buildKb(){const kb=$('kb');kb.innerHTML='';const sp=()=>{const d=document.createElement('div');d.className='sp';return d};
  ['qwertyuiop','asdfghjkl','zxcvbnm'].forEach((r,i)=>{const d=document.createElement('div');d.className='kr';
    if(i==1)d.append(sp());if(i==2)d.append(mk('ENTER','Enter','wide en'));
    for(const c of r)d.append(mk(c,c));
    if(i==1)d.append(sp());if(i==2)d.append(mk('⌫','Backspace','wide bk'));kb.append(d)})}
function paintKeys(g,res){const rank={a:1,p:2,c:3};g.split('').forEach((ch,i)=>{const k=$('kb').querySelector(`[data-k="${ch}"]`);if(!k)return;
  if((rank[k.dataset.s]||0)>=rank[res[i]])return;k.dataset.s=res[i];k.classList.remove('a','p','c');k.classList.add(res[i])})}

/* input */
const curRow=()=>$('board').children[gs.length];
function press(k){
  if(!on||busy)return;
  if(k==='Enter')return submit();
  if(k==='Backspace'){inp=inp.slice(0,-1);return draw()}
  if(/^[a-z]$/i.test(k)&&inp.length<5){inp+=k.toLowerCase();draw();const t=curRow().children[inp.length-1];t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}
}
function draw(){[...curRow().children].forEach((t,i)=>{t.textContent=inp[i]||'';t.className='tile'})}
addEventListener('keydown',e=>{if(!on||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Enter'||e.key==='Backspace'||/^[a-zA-Z]$/.test(e.key)){e.preventDefault();press(e.key)}});
function hint(m){$('hint').textContent=m;setTimeout(()=>$('hint').textContent='',2000)}
function shake(){[...curRow().children].forEach((t,i)=>setTimeout(()=>{t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')},i*25))}

/* grading */
function grade(word,g){const a=word.split(''),r=Array(5).fill('a'),f={};a.forEach(c=>f[c]=(f[c]||0)+1);
  for(let i=0;i<5;i++)if(g[i]===a[i]){r[i]='c';f[g[i]]--}
  for(let i=0;i<5;i++)if(r[i]!=='c'&&f[g[i]]>0){r[i]='p';f[g[i]]--}return r}
const emoji=(w,list)=>list.map(g=>grade(w,g).map(x=>({c:'🟩',p:'🟨',a:'⬜'}[x])).join('')).join('\n');
function submit(){
  if(inp.length!==5){hint('Need 5 letters!');return shake()}
  if(!WS.has(inp)){hint('Not a valid word!');return shake()}
  busy=true;const g=inp,res=grade(cur,g),row=curRow();inp='';
  g.split('').forEach((ch,i)=>{const t=row.children[i];setTimeout(()=>{t.classList.add('flip');setTimeout(()=>t.classList.add(res[i]),150)},i*70)});
  setTimeout(()=>{paintKeys(g,res);gs.push(g);act();
    if(g===cur)won();else if(gs.length>=6)lost();else busy=false},5*70+300);
}

/* scoring */
function won(){
  const n=gs.length,sec=wt(),bonus=[0,15,10,7,5,3,0][n],pts=[0,6,5,4,3,2,1][n]+(sec<20?3:sec<40?1:0);
  tot+=n;if(n===1)perf++;fast=Math.min(fast,sec);tb+=bonus;str++;best=Math.max(best,str);sc+=pts;solved++;att+=n;
  log.push({word:cur,guesses:[...gs],pts,time:sec});
  [...$('board').children[n-1].children].forEach((t,i)=>setTimeout(()=>{t.classList.remove('flip');t.classList.add('jump')},i*70));
  if(bonus){tl=Math.min(tl+bonus,TOTAL);arcUpdate();const b=document.createElement('div');b.className='bonus';b.textContent='+'+bonus+'s';document.body.append(b);setTimeout(()=>b.remove(),1000)}
  $('sv').textContent=sc;$('wv').textContent=solved+' solved';{const r=$('board').getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2)}flash(cur,'+'+pts+' pts'+(bonus?' · +'+bonus+'s':''),false);
}
function lost(){log.push({word:cur,guesses:[...gs],pts:0,time:wt(),failed:true});str=0;tot+=gs.length;flash(cur,'✗ not solved',true)}
function flash(w,txt,bad){renderLog();$('fw').textContent=w.toUpperCase();$('fp').textContent=txt;$('flash').className='on'+(bad?' bad':'');
  setTimeout(()=>$('flash').className='',700);setTimeout(next,1100)}
function renderLog(){
  let h='<div class="lt">Words this round</div>';if(!log.length)h+='<p style="color:var(--mu);text-align:center;padding:16px">Your words will appear here</p>';
  for(let i=log.length-1;i>=0;i--){const e=log[i];
    h+=`<div class="lr ${e.failed?'bad':''}"><b>${e.word.toUpperCase()}</b><span>${e.failed?'missed':e.guesses.length+(e.guesses.length===1?' try':' tries')} · ${e.time}s</span><em>${e.failed?'✗':'+'+e.pts}</em><small>${e.guesses.length?e.guesses.join(' › ').toUpperCase():'skipped'}</small></div>`}
  $('log').innerHTML=h;$('log').scrollTop=0}
function next(){if(!on)return;gs=[];inp='';load();buildBoard();buildKb();$('wn').textContent=log.length+1;busy=false}
function load(){if(!Q.length)Q=shuffle(W);cur=Q.pop();t0=Date.now();$('hint').textContent='';wtimer()}
function wtimer(){if(!on)return;const t=wt();$('wtm').textContent=t<20?'⚡ +3 bonus · '+(20-t)+'s':t<40?'+1 bonus · '+(40-t)+'s':'no speed bonus'}

/* skip needs a second tap */
$('skip').onclick=()=>{
  if(!on||busy)return;
  if(Date.now()-skipArm>2500){skipArm=Date.now();$('skip').textContent='Tap again to skip';setTimeout(()=>$('skip').textContent='⏭ Skip',2500);return}
  skipArm=0;$('skip').textContent='⏭ Skip';busy=true;log.push({word:cur,guesses:[...gs],pts:0,time:wt(),failed:true});str=0;tot+=Math.max(1,gs.length);flash(cur,'✗ skipped',true);
};

/* timer */
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function arcUpdate(){$('arc').style.strokeDashoffset=ARC*(1-tl/TOTAL);$('arc').style.stroke=tl>90?'#00c6ff':tl>60?'#ff8f00':'#e53935';
  $('hud').className='hud'+(tl<=30?' low':tl<=90?' warn':'');$('tt').textContent=fmt(Math.max(0,tl))}
function startGame(){
  tot=perf=att=sc=solved=tb=best=str=0;fast=999;tl=TOTAL;log=[];gs=[];inp='';Q=shuffle(W);busy=false;on=true;
  $('sv').textContent='0';$('wv').textContent='0 solved';$('wn').textContent='1';
  show('game');load();buildBoard();buildKb();renderLog();arcUpdate();g0=Date.now();
  clearInterval(iv);iv=setInterval(()=>{tl--;arcUpdate();wtimer();if(tl<=0)endGame()},1000);
}

/* end */
function endGame(){
  on=false;clearInterval(iv);
  if(cur&&!log.some(e=>e.word===cur)&&gs.length<6){log.push({word:cur,guesses:[...gs],pts:0,time:wt(),failed:true});tot+=Math.max(1,gs.length)}
  fin={score:sc,solved,failed:log.filter(e=>e.failed).length,att,tot,perf,fast:fast===999?0:fast,tb,best,spent:Math.round((Date.now()-g0)/1000),log:[...log]};
  setTimeout(showEnd,500);
}
function showEnd(){
  const s=fin;show('end');
  boom(innerWidth/2,innerHeight/3,false);$('es').textContent=s.score;$('ew').textContent=s.solved;$('ea').textContent=s.solved?(s.att/s.solved).toFixed(1):'–';
  $('et').textContent=s.solved>=8?'🏆 LEGENDARY!':s.solved>=5?'🔥 ON FIRE!':'⏱️ TIME\'S UP!';
  $('wl').innerHTML=s.log.length?s.log.map(e=>`<div class="we"><b>${e.word.toUpperCase()}</b><span>${emoji(e.word,e.guesses).split('\n').join('<br>')}</span><em>${e.failed?'✗':'+'+e.pts}</em></div>`).join(''):'<p style="text-align:center;color:var(--mu)">No words solved. Try again!</p>';
  let n='',d='';try{n=localStorage.getItem(NK);d=localStorage.getItem(DK)}catch(e){}
  $('who').textContent='👤 '+n+' · '+d;
  fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:n,department:d,score:s.score,correct:s.solved,wrong:s.failed,time_spent:s.spent,total_attempts:s.tot,perfect_solves:s.perf,fastest_solve_sec:s.fast,total_time_bonus:s.tb,longest_streak:s.best,quest_id:"Wordleblitz"})}).catch(e=>console.error('Submit failed',e));
}
/* ===== background particles, fireworks, confetti ===== */
const fxs=['pc','fx1','cf'].map(id=>{const c=$(id);return[c,c.getContext('2d')]});
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rsz=()=>fxs.forEach(([c])=>{c.width=innerWidth;c.height=innerHeight});rsz();addEventListener('resize',rsz);
if(!reduced)(()=>{const[c,x]=fxs[0];
  const p=[...Array(50)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.4,dx:(Math.random()-.5)*.3,dy:-(Math.random()*.35+.08),a:Math.random()*.45+.1,k:Math.random()>.5?'0,198,255':'255,215,0'}));
  (function f(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fillStyle=`rgba(${q.k},${q.a})`;x.fill();q.x+=q.dx;q.y+=q.dy;if(q.y<-5){q.y=c.height+5;q.x=Math.random()*c.width}if(q.x<-5)q.x=c.width+5;if(q.x>c.width+5)q.x=-5});requestAnimationFrame(f)})();
})();
let fp=[],cp=[],fxOn=false;
function fxLoop(){
  const[c1,x1]=fxs[1],[c2,x2]=fxs[2];x1.clearRect(0,0,c1.width,c1.height);x2.clearRect(0,0,c2.width,c2.height);
  fp=fp.filter(p=>p.a>0);cp=cp.filter(p=>p.a>0);
  fp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.97;p.a-=.018;x1.globalAlpha=Math.max(0,p.a);x1.fillStyle=p.k;x1.beginPath();x1.arc(p.x,p.y,p.r,0,6.283);x1.fill()});x1.globalAlpha=1;
  cp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.vx*=.99;p.t+=p.dr;p.a-=.008;x2.save();x2.globalAlpha=Math.max(0,p.a);x2.translate(p.x,p.y);x2.rotate(p.t);x2.fillStyle=p.k;x2.fillRect(-p.w/2,-p.h/2,p.w,p.h);x2.restore()});
  if(fp.length||cp.length)requestAnimationFrame(fxLoop);else fxOn=false;
}
const kick=()=>{if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}};
function boom(cx,cy,conf=true){
  if(reduced)return;
  [['#1e8a4a',0,0],['#ffd700',-100,-30],['#00c6ff',100,-30]].forEach(([k,dx,dy],n)=>setTimeout(()=>{for(let i=0;i<55;i++){const a=i/55*6.283,sp=Math.random()*6+2;fp.push({x:cx+dx,y:cy+dy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,k,a:1,r:Math.random()*2.5+.8})}kick()},n*200));
  if(conf)setTimeout(()=>{const cols=['#1e8a4a','#c8920a','#ffffff','#00c6ff','#ff8f00','#e91e63','#7c4dff'];
    for(let i=0;i<180;i++){const a=Math.random()*6.283,sp=Math.random()*10+3;cp.push({x:innerWidth/2,y:innerHeight*.4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,k:cols[Math.random()*cols.length|0],w:Math.random()*11+4,h:Math.random()*5+2,t:Math.random()*6.283,dr:(Math.random()-.5)*.28,a:1})}kick()},300);
}

/* ===== WhatsApp share with a stats image ===== */
function statsImage(s,n,d){
  const c=$('stc'),x=c.getContext('2d'),w=1080,rows=Math.ceil(s.log.length/2),H=900+Math.max(rows,2)*88+60;c.width=w;c.height=H;
  const box=(bx,by,bw,bh,fill,line)=>{x.beginPath();x.roundRect(bx,by,bw,bh,16);x.fillStyle=fill;x.fill();x.strokeStyle=line;x.lineWidth=2;x.stroke()};
  x.fillStyle='#080e1a';x.fillRect(0,0,w,H);
  const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#00c6ff');g.addColorStop(1,'#ffd700');x.fillStyle=g;x.fillRect(0,0,w,12);x.fillRect(0,H-12,w,12);
  x.textAlign='center';x.font='bold 84px Rajdhani,sans-serif';x.fillText('⚡ WORDLE BLITZ',w/2,115);
  x.fillStyle='#7a93b8';x.font='28px Nunito,sans-serif';x.fillText('5-MINUTE SPEED CHALLENGE',w/2,165);
  if(n){x.fillStyle='#ffd700';x.font='bold 38px Rajdhani,sans-serif';x.fillText('👤 '+n+' · '+d,w/2,222)}
  box(64,255,952,170,'#111e30','#00c6ff');x.fillStyle='#ffd700';x.font='bold 110px Rajdhani,sans-serif';x.fillText(String(s.score),w/2,365);
  x.fillStyle='#7a93b8';x.font='24px Nunito,sans-serif';x.fillText('TOTAL SCORE',w/2,405);
  [['Words solved',s.solved,'#22c55e'],['Words missed',s.failed,'#ff6b6b'],['Perfect solves',s.perf,'#00c6ff'],['Longest streak',s.best,'#ff8f00'],['Fastest solve',s.fast?s.fast+'s':'—','#ffd700'],['Time bonus','+'+s.tb+'s','#00e676']].forEach(([l,v,col],i)=>{
    const mx=64+(i%2)*486,my=455+(i>>1)*110;box(mx,my,466,96,'#111e30',col);
    x.fillStyle=col;x.font='bold 52px Rajdhani,sans-serif';x.textAlign='left';x.fillText(String(v),mx+24,my+63);
    x.fillStyle='#7a93b8';x.font='20px Nunito,sans-serif';x.textAlign='right';x.fillText(l.toUpperCase(),mx+442,my+58)});
  x.textAlign='center';x.fillStyle='#7a93b8';x.font='bold 26px Nunito,sans-serif';x.fillText('ALL WORDS',w/2,835);
  s.log.forEach((e,i)=>{const wx=64+(i%2)*486,wy=860+(i>>1)*88,col=e.failed?'#e53935':'#1e8a4a';
    box(wx,wy,466,76,'#111e30',col);x.fillStyle=col;x.fillRect(wx,wy+12,6,52);
    x.textAlign='left';x.fillStyle=e.failed?'#ff6b6b':'#e8f0fe';x.font='bold 34px Rajdhani,sans-serif';x.fillText(e.word.toUpperCase(),wx+22,wy+49);
    x.textAlign='center';x.font='20px Nunito,sans-serif';x.fillStyle='#9fb7db';x.fillText(e.failed?'✗ missed':e.guesses.length===1?'🎯 1 try':e.guesses.length+' tries',wx+240,wy+46);
    x.textAlign='right';x.font='bold 30px Rajdhani,sans-serif';x.fillStyle=e.failed?'#777':'#ffd700';x.fillText(e.failed?'–':'+'+e.pts,wx+446,wy+49)});
  x.textAlign='center';x.fillStyle='#7a93b8';x.font='24px Nunito,sans-serif';x.fillText('andrewveda.com/verve/buttons/wordle-hub',w/2,H-36);
  return c;
}
$('share').onclick=()=>{
  const s=fin,g=s.log.filter(e=>!e.failed).map(e=>e.word.toUpperCase()+': '+emoji(e.word,e.guesses).split('\n')[0]).join('\n');
  const text=`⚡ Wordle Blitz — I solved ${s.solved} words and scored ${s.score} pts!\n\n${g}\n\n🎯 Try it: ${SITE}`;
  const wa=()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  let n='',d='';try{n=localStorage.getItem(NK);d=localStorage.getItem(DK)}catch(e){}
  statsImage(s,n,d).toBlob(blob=>{
    if(!blob)return wa();
    const f=new File([blob],'wordle-blitz-stats.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({title:'Wordle Blitz Stats',text,files:[f]}).catch(wa);
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wordle-blitz-stats.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);wa()}
  },'image/png');
};

/* ===== downloadable report: words, time per word, meanings ===== */
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=s=>s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s';
async function meaning(w){
  try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+w,{signal:ac.signal});clearTimeout(t);if(!r.ok)return null;
    const d=await r.json(),o=[];for(const m of d[0].meanings){const f=m.definitions[0];if(f)o.push({pos:m.partOfSpeech,def:f.definition,ex:f.example||''});if(o.length===2)break}
    return o.length?o:null}catch(e){return null}
}
const tiles=(w,g)=>{const r=grade(w,g);return g.split('').map((ch,i)=>`<i class="${r[i]}">${ch}</i>`).join('')};
function reportHTML(s,n,d,ms){
  const log=s.log,ok=log.filter(e=>!e.failed),avg=log.length?Math.round(log.reduce((a,e)=>a+(e.time||0),0)/log.length):0;
  const cards=log.map((e,i)=>{const m=ms[i];
    const rows=e.guesses.length?e.guesses.map(g=>`<div class="g">${tiles(e.word,g)}</div>`).join(''):'<div class="sk">skipped before guessing</div>';
    const mean=m?m.map(x=>`<p><b>${esc(x.pos)}</b> ${esc(x.def)}</p>`).join('')+(m[0].ex?`<p class="ex">“${esc(m[0].ex)}”</p>`:''):'<p class="ex">No meaning found (offline or not in the dictionary).</p>';
    return `<section class="card ${e.failed?'bad':''}"><div class="top"><span class="w">${e.word.toUpperCase()}</span><span class="chip t">⏱ ${fmtT(e.time||0)}</span><span class="chip ${e.failed?'x':'p'}">${e.failed?'missed':'+'+e.pts+' pts'}</span></div><div class="meta">#${i+1} · ${e.failed?'not solved':e.guesses.length+(e.guesses.length===1?' try':' tries')}</div><div class="grid">${rows}</div><div class="mean">${mean}</div></section>`}).join('');
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordle Blitz Report</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font:16px/1.45 system-ui,sans-serif;background:#080e1a;color:#e8f0fe;padding:14px;max-width:560px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;color:#ffd700}.who{text-align:center;color:#7a93b8;font-size:.85rem;margin:2px 0 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.sum div{background:#0d1525;border:1px solid #1b2a44;border-radius:12px;padding:10px 4px;text-align:center}
.sum b{display:block;font-size:1.5rem;color:#ffd700}.sum span{font-size:.65rem;color:#7a93b8;text-transform:uppercase}
.card{background:#0d1525;border:1px solid #1b2a44;border-left:4px solid #1e8a4a;border-radius:14px;padding:12px 14px;margin-bottom:12px}.card.bad{border-left-color:#e53935}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.w{font-size:1.4rem;font-weight:800;letter-spacing:2px;margin-right:auto}
.chip{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#111e30}.t{color:#00c6ff}.p{color:#ffd700}.x{color:#ff6b6b}
.meta{font-size:.75rem;color:#7a93b8;margin:2px 0 8px}.grid{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}.g{display:flex;gap:3px}
.g i{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font:700 .85rem system-ui;text-transform:uppercase;color:#fff}
.g .c{background:#1e8a4a}.g .p{background:#c8920a;color:#fff}.g .a{background:#2a2d35}.sk{font-size:.8rem;color:#7a93b8;font-style:italic}
.mean{font-size:.9rem;color:#bcd3ef;border-top:1px solid #1b2a44;padding-top:8px}.mean p+p{margin-top:4px}.mean b{color:#00c6ff;font-style:italic;margin-right:4px}.ex{color:#7a93b8;font-style:italic}
footer{text-align:center;color:#7a93b8;font-size:.7rem;margin-top:18px}</style></head><body>
<h1>⚡ WORDLE BLITZ</h1><div class="who">${n?'👤 '+esc(n)+(d?' · '+esc(d):'')+' · ':''}${new Date().toLocaleDateString()}</div>
<div class="sum"><div><b>${s.score}</b><span>Score</span></div><div><b>${ok.length}/${log.length}</b><span>Solved</span></div><div><b>${fmtT(avg)}</b><span>Avg / word</span></div></div>
${cards}<footer>Meanings via dictionaryapi.dev</footer></body></html>`;
}
$('rep').onclick=async()=>{
  const b=$('rep'),old=b.textContent;b.textContent='⏳ Preparing…';b.disabled=true;
  try{
    let n='',d='';try{n=localStorage.getItem(NK);d=localStorage.getItem(DK)}catch(e){}
    const ms=await Promise.all(fin.log.map(e=>meaning(e.word)));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([reportHTML(fin,n,d,ms)],{type:'text/html'}));a.download='wordle-blitz-report.html';
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){console.error('Report failed',e)}
  finally{b.textContent=old;b.disabled=false}
};

$('again').onclick=startGame;
$('lb').onclick=()=>window.open('https://andrewveda.com/verve/buttons/wordleleaderboard','_blank');
</script>
