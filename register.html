<head>

<title>Mystic Summit – SIH 2026 Team Registration</title>
<style>
:root{--bg:#f4f2fa;--card:#fff;--ink:#1d1a33;--mute:#65628408;--mute:#66638a;--line:#dcd8ec;--brand:#4a3aa8;--on:#fff;--accent:#f0b24a;--bad:#b3261e;--badbg:#fdecea;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12102a;--card:#1c1a3a;--ink:#eeecff;--mute:#a4a1c8;--line:#343160;--brand:#a99bff;--on:#14112e;--bad:#ffb4ab;--badbg:#3a1f26;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:22px 0 14px}
h1{font:700 34px/1.05 Georgia,"Times New Roman",serif;margin:0 0 6px;letter-spacing:-.5px}
header p{margin:0;color:var(--mute);font-size:15px}
.prog{display:flex;gap:6px;margin:16px 0 0}
.prog div{flex:1;font-size:13px;color:var(--mute);border-top:4px solid var(--line);padding-top:6px}
.prog .on{border-color:var(--accent);color:var(--ink);font-weight:600}
h2{font-size:20px;margin:18px 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
label.f{display:block;margin:0 0 14px;font-weight:600;font-size:15px}
input,select,textarea{display:block;width:100%;margin-top:6px;min-height:48px;padding:10px 12px;font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.filters{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding:8px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.filters input{margin:0 0 8px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip,.seg2 button{flex:none;min-height:44px;padding:0 14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;font:inherit;font-size:14px;white-space:nowrap}
.chip b{font-weight:600;color:var(--mute);margin-left:4px}
.on.chip,.seg2 .on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.on.chip b{color:inherit}
#count,.cnt{font-size:13px;color:var(--mute);margin:10px 0 8px}
.ps{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;content-visibility:auto;contain-intrinsic-size:auto 120px}
.ps.sel{border-color:var(--brand);box-shadow:inset 6px 0 0 var(--accent)}
.ps .id{font-weight:700;font-size:13px}
.tag{float:right;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.ps .t{display:block;margin:6px 0 4px;font-weight:600}
.ps .o{display:block;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:28px 8px}
fieldset{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:6px 14px 2px;margin:0 0 14px}
legend{font-weight:700;padding:0 6px}
.seg{display:flex;gap:6px;margin-top:6px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--line);border-radius:10px;font-weight:400}
.seg input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--accent)}
#err{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:15px}
#err:empty{display:none}
#err ul{margin:0;padding-left:18px}
.sel-box{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#bar div{max-width:640px;margin:0 auto}
#bar small{display:block;color:var(--mute);font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .btns{display:flex;gap:10px}
.btn{flex:1;min-height:50px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:inherit;font-weight:700}
.btn.ghost{flex:0 0 96px;background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn:disabled{opacity:.55}
.done{text-align:center;padding:30px 0}
.done .big{font:700 44px Georgia,serif;margin:8px 0}
.pickbtn{display:block;width:100%;margin-top:6px;min-height:56px;text-align:left;padding:8px 12px;font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px}
.pickbtn b,.st b{display:block;font-weight:600}
.pickbtn span,.st span{display:block;font-size:13px;color:var(--mute)}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#sheet[hidden]{display:none}
.shtop{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.shtop input{margin:0;flex:1}
.shtop .btn{flex:0 0 auto;padding:0 16px;min-height:48px}
#sl{overflow-y:auto;flex:1;padding:6px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.st{display:block;width:100%;min-height:56px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.st:disabled{opacity:.5}
@media(prefers-reduced-motion:no-preference){.prog div{transition:border-color .2s}}
</style>
</head>

function render(scroll){

  $("#app").innerHTML=head+(S.done?doneView():[teamView,psView,memView][S.step-1]());

const fld=(k,label,val,attrs="")=>`<label class="f">${label}<input data-k="${k}" value="${esc(val)}" ${attrs}></label>`;
function teamView(){const t=S.team;return `<h2>Your team</h2><p class="sub">The team leader fills this in for everyone.</p><div id="err" role="alert"></div>

  ${fld("team.email","Team leader email",t.email,'type="email" inputmode="email" autocomplete="email"')}
  ${fld("team.phone","Team leader mobile number",t.phone,'type="tel" inputmode="numeric" maxlength="10" autocomplete="tel"')}
  <label class="f">Faculty mentor (optional)<select data-k="team.mentor"><option value="">Select a mentor</option>${CFG.MENTORS.map(m=>`<option ${t.mentor===m?"selected":""}>${esc(m)}</option>`).join("")}</select></label>`}
function psView(){return `<h2>Pick a problem statement</h2><p class="sub">Choose a category, then tap one problem statement.</p><div id="err" role="alert"></div>

  <div class="row seg2">${["All","Software","Hardware"].map(t=>`<button type="button" class="${S.type===t?"on":""}" data-act="type" data-v="${t}">${t}</button>`).join("")}</div>
  <div class="row" id="chips" style="margin-top:6px"></div></div>
  <div id="count"></div><div id="list"></div>`}
function memView(){
  const ps=PS.find(p=>p[0]===S.ps);
  return `<h2>Team members</h2><p class="sub">Member 1 is the team leader. Tap a slot, then search by name or register number.</p><div id="err" role="alert"></div>

function sheetList(){
  const q=$("#sheet [data-k=sq]").value.trim().toLowerCase();
  const taken=new Set(S.m.filter((m,i)=>i!==SI&&m.reg).map(m=>m.reg));
  if(!q){$("#sl").innerHTML='<p class="empty">Start typing a name or register number to see matching students.</p>';return}
  const rows=ROSTER.filter(r=>(r[2]+" "+r[0]+" "+r[1]).toLowerCase().includes(q));
  $("#sl").innerHTML=`<div class="cnt">${rows.length} match${rows.length===1?"":"es"}${rows.length>60?", showing 60. Type more to narrow down.":""}</div>`+(rows.length?"":'<p class="empty">No student found. Check the spelling or try the register number.</p>')+rows.slice(0,60).map(r=>`<button type="button" class="st" data-act="choose" data-v="${r[0]}" ${taken.has(r[0])?"disabled":""}><b>${esc(r[2])}</b><span>${r[0]} / ${esc(r[3])}${taken.has(r[0])?" (already added)":""}</span></button>`).join("");
}
function openSheet(i){SI=i;const s=$("#sheet");s.hidden=false;document.body.style.overflow="hidden";const q=s.querySelector("[data-k=sq]");q.value="";sheetList();q.focus()}
function closeSheet(){$("#sheet").hidden=true;document.body.style.overflow="";SI=-1}
function doneView(){
  const p=S.done.p;
  return `<div class="done"><h2>Registration complete</h2><p class="sub">Download your registration as an HTML file and submit it to your coordinator. Keep a copy with you.</p>
  <div class="sel-box" style="text-align:left"><b>${esc(p.team.name)}</b><br>${esc(p.psId)} ${esc(p.psTitle)}</div>
  <button class="btn" data-act="dl">Download as HTML</button><div style="height:10px"></div><button class="btn ghost" style="width:100%" data-act="reset">Register another team</button></div>`}
function receipt(d){
  const p=d.p,when=new Date(d.at||Date.now()).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
  const rows=p.members.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.name)}</b>${i?"":" (leader)"}<br><span class="s">${esc(m.reg)} / ${esc(m.gender)}<br>${esc(m.dept)}</span></td></tr>`).join("");
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.team.name)} – Mystic Summit registration</title>
<style>:root{--bg:#f4f2fa;--card:#fff;--ink:#1d1a33;--mute:#66638a;--line:#dcd8ec;--brand:#4a3aa8;--accent:#f0b24a;color-scheme:light}

function download(){
  const d=S.done;if(!d||!d.p)return;
  const name=("Mystic-Summit-"+d.p.team.name).replace(/[^\w-]+/g,"-")+".html";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([receipt(d)],{type:"text/html"}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function list(){
  const q=S.q.trim().toLowerCase();
  const base=PS.filter(p=>(S.type==="All"||p[4]===S.type)&&(!q||(p[0]+" "+p[1]+" "+p[2]).toLowerCase().includes(q)));
  const n=c=>base.filter(p=>c==="All"||p[3]===c).length;
  $("#chips").innerHTML=["All",...CATS].map(c=>`<button type="button" class="chip${S.cat===c?" on":""}" data-act="cat" data-v="${esc(c)}">${esc(c)}<b>${n(c)}</b></button>`).join("");
  const rows=base.filter(p=>S.cat==="All"||p[3]===S.cat);
  $("#count").textContent=rows.length+" problem statement"+(rows.length===1?"":"s");
  $("#list").innerHTML=rows.map(p=>`<button type="button" class="ps${S.ps===p[0]?" sel":""}" data-act="pick" data-v="${p[0]}"><span class="id">${p[0]}</span><span class="tag">${p[4]}</span><span class="t">${esc(p[1])}</span><span class="o">${esc(p[2])}${S.cat==="All"?" / "+esc(p[3]):""}</span></button>`).join("")||'<p class="empty">Nothing matches. Clear the search or choose another category.</p>';
}
function bar(){
  if(S.done){$("#bar").style.display="none";return}
  $("#bar").style.display="";
  const last=S.step===3;
  $("#bar").innerHTML=`<div>${S.step===2?`<small>${S.ps?"Selected: "+esc(S.ps):"No problem statement selected yet"}</small>`:""}<div class="btns">${S.step>1?'<button class="btn ghost" data-act="back">Back</button>':""}<button class="btn" id="next" data-act="${last?"submit":"next"}">${last?"Finish registration":"Continue"}</button></div></div>`;
}
function showErr(a){const e=$("#err");if(!e)return;e.innerHTML=a.length>1?"<ul>"+a.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>":esc(a[0]);e.scrollIntoView({block:"center",behavior:"smooth"})}
function validate(s){
  const e=[],t=S.team;
  if(s===1){
    if(t.name.trim().length<2)e.push("Enter your team name.");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t.email.trim()))e.push("Enter a valid email address.");
    if(!/^[6-9]\d{9}$/.test(t.phone.trim()))e.push("Enter a 10-digit mobile number.");
  }
  if(s===2&&!S.ps)e.push("Tap a problem statement to select it.");
  if(s===3){
    const seen={};let f=0;
    S.m.forEach((m,i)=>{const n=i+1;
      if(!m.reg)e.push(`Member ${n}: choose a student.`);
      else if(seen[m.reg])e.push(`Member ${n}: same student as Member ${seen[m.reg]}.`);else seen[m.reg]=n;
      if(!m.gender)e.push(`Member ${n}: choose gender.`);if(m.gender==="Female")f++;});
    if(!e.length&&f<1)e.push("At least one member must be female.");
  }
  return e;
}
const payload=()=>{const p=PS.find(x=>x[0]===S.ps);return{team:S.team,psId:S.ps,psTitle:p?p[1]:"",category:p?p[3]:"",members:S.m}};
function submit(){
  const errs=[1,2,3].flatMap(validate);
  if(errs.length)return showErr(errs);
  S.done={p:payload(),at:Date.now()};save();render(true);
}
document.addEventListener("input",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  if(k==="sq")return sheetList();
  let v=e.target.value;
  if(k==="team.phone"){v=v.replace(/\D/g,"");e.target.value=v}
  const x=k.split(".");
  if(x[0]==="m")S.m[+x[1]][x[2]]=v;else if(x[0]==="team")S.team[x[1]]=v;else{S.q=v;list()}
  save();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==="cat"){S.cat=v;list();save()}
  else if(a==="type"){S.type=v;document.querySelectorAll('[data-act="type"]').forEach(b=>b.classList.toggle("on",b.dataset.v===v));list();save()}
  else if(a==="pick"){S.ps=v;list();bar();save()}
  else if(a==="next"){const er=validate(S.step);if(er.length)return showErr(er);S.step++;save();render(true)}
  else if(a==="back"){S.step--;save();render(true)}
  else if(a==="submit")submit();
  else if(a==="open")openSheet(+v);
  else if(a==="close")closeSheet();
  else if(a==="choose"){const r=ROSTER.find(x=>x[0]===v),m=S.m[SI];m.reg=r[0];m.name=r[2];m.dept=r[3];closeSheet();save();const y=scrollY;render();scrollTo(0,y)}
  else if(a==="dl")download();
  else if(a==="reset"){if(confirm("Clear this registration and start over?")){S=blank();save();render(true)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
render();
</script>
</body>
</html>
