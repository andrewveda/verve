<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Catalyst Thon | Aptitude Round</title>
  
  <!-- Premium Google Fonts: Cormorant Garamond (Headings) & Montserrat (Body/Accents) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF7F2;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(197, 168, 128, 0.35);
      --card-border-hover: #B89758;
      --text-main: #2A2421;
      --text-muted: #736B66;
      --gold-accent: #9E7D3B;
      --gold-light: #C5A880;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      padding: 2.5rem 1.25rem 2rem;
    }

    /* Subtle Faint Geometric Pattern Background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(var(--gold-light) 0.75px, transparent 0.75px),
        linear-gradient(45deg, transparent 48%, rgba(197, 168, 128, 0.08) 50%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(197, 168, 128, 0.08) 50%, transparent 52%);
      background-size: 32px 32px, 64px 64px, 64px 64px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .institution {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .department {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-accent);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .divider {
      width: 44px;
      height: 1px;
      background-color: var(--gold-accent);
      margin: 0 auto 1.2rem;
      opacity: 0.6;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .sub-round {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: var(--gold-accent);
      letter-spacing: 0.08em;
    }

    /* Links Directory Grid */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 2.5rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.05rem 1.35rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(42, 36, 33, 0.025);
    }

    .link-card:active {
      transform: scale(0.985);
      background: #FFFFFF;
      border-color: var(--card-border-hover);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .link-index {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      color: var(--gold-accent);
      font-style: italic;
      min-width: 18px;
    }

    .link-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .arrow-icon {
      width: 14px;
      height: 14px;
      stroke: var(--gold-accent);
      stroke-width: 1.5;
      fill: none;
      transition: transform 0.2s ease;
    }

    .link-card:hover .arrow-icon,
    .link-card:active .arrow-icon {
      transform: translateX(3px);
    }

    /* Footer Styling */
    footer {
      text-align: center;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(197, 168, 128, 0.2);
    }

    .footer-quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: var(--gold-accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="institution">SRM Valliammai Engineering College</div>
      <div class="department">Department of English</div>
      <div class="divider"></div>
      <h1>Career Catalyst Thon</h1>
      <div class="sub-round">Aptitude Round</div>
    </header>

    <main class="link-list">
      <a href="https://andrewveda.com/verve/aptitude/thon/blossom" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">I.</span>
          <span class="link-title">Blossom</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a href="https://andrewveda.com/verve/aptitude/thon/wordleblitz" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">II.</span>
          <span class="link-title">Wordle Blitz</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a href="https://andrewveda.com/verve/aptitude/thon/wordrush" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">III.</span>
          <span class="link-title">WordRush</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a href="https://andrewveda.com/verve/aptitude/thon/sentencesnap" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">IV.</span>
          <span class="link-title">Sentence Snap</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a href="https://andrewveda.com/verve/aptitude/thon/jigsaw" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">V.</span>
          <span class="link-title">Jigsaw</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a href="https://andrewveda.com/verve/aptitude/thon/anagram" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">VI.</span>
          <span class="link-title">Anagram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <a href="https://andrewveda.com/verve/aptitude/thon/mcq" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="link-info">
          <span class="link-index">VII.</span>
          <span class="link-title">MCQ</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </main>

    <footer>
      <p class="footer-quote">"Live long and Prosper!"</p>
    </footer>
  </div>

</body>
</html>
