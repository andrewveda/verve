<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Degrees of Comparison — Verve</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --paper:#f3ead4; --card:#fffbf2; --card-line:#e3d5b0;
      --ink:#2d2620; --ink-muted:#8c7c62;
      --forest:#2f5233; --moss:#6f8f5a; --clay:#b5651d; --rust:#a4392c;
      --pos:#4f8f5f; --comp:#c9932a; --sup:#a4392c;
      --shadow-sm:0 1px 2px rgba(45,38,32,.08),0 3px 8px rgba(45,38,32,.06);
      --shadow-md:0 2px 6px rgba(45,38,32,.10),0 10px 26px rgba(45,38,32,.12);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    html,body{min-height:100%;overscroll-behavior-x:none;}
    body{
      font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
      min-height:100dvh; display:flex; flex-direction:column; align-items:center;
      background-image:
        radial-gradient(ellipse 70% 50% at 12% 8%, rgba(111,143,90,.14) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 92% 88%, rgba(181,101,29,.10) 0%, transparent 60%);
    }

    .screen{display:none;flex-direction:column;align-items:center;width:100%;min-height:100dvh;}
    .screen.active{display:flex;}
    #mainScreen{align-items:stretch;}
    .col{
      display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;
      padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
      gap:clamp(10px,1.5dvh,14px);
    }

    /* ═══════ Name / Department Gate ═══════ */
    #nameForm{align-items:center;justify-content:center;padding:24px;}
    .gate-card{
      width:100%;max-width:400px;background:var(--card);border:1.5px solid var(--card-line);
      border-radius:20px;padding:34px 26px 28px;box-shadow:0 20px 60px rgba(45,38,32,.14);
      display:flex;flex-direction:column;align-items:stretch;gap:14px;
      animation:cardIn .5s cubic-bezier(.34,1.4,.64,1) forwards;
    }
    .hero-quote{text-align:center;margin-bottom:8px;}
    .hero-text{font-family:'Fraunces',serif;font-weight:900;font-size:1.8rem;color:var(--forest);letter-spacing:-.5px;}
    .hero-author{font-size:1.1rem;margin-top:4px;}
    .gate-label{font-family:'Space Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin:6px 0 -6px;}
    #nameInput, #departmentSelect{
      width:100%;padding:14px 15px;border-radius:12px;border:1.5px solid var(--card-line);
      background:#fffdf7;font-family:'Inter',sans-serif;font-size:1rem;color:var(--ink);
      appearance:none;-webkit-appearance:none;
    }
    #departmentSelect{
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238c7c62' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
      background-repeat:no-repeat;background-position:right 14px center;background-size:18px;
    }
    #nameInput:focus, #departmentSelect:focus{outline:none;border-color:var(--moss);}
    #gateError{color:var(--rust);font-size:.78rem;font-family:'Space Mono',monospace;text-align:center;min-height:1em;}
    .btn-start{
      margin-top:6px;padding:15px;border:none;border-radius:12px;
      background:linear-gradient(135deg,var(--forest),var(--moss));color:#fff;
      font-family:'Inter',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.03em;
      text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(47,82,51,.25);
      transition:transform .15s;
    }
    .btn-start:active{transform:scale(.97);}

    /* ═══════ Top Bar ═══════ */
    .top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:1.35rem;color:var(--forest);letter-spacing:-.3px;}
    .brand span{color:var(--rust);}
    .brand .sub{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-top:1px;}
    
    .timer-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--card-line);border-radius:99px;padding:6px 13px;box-shadow:var(--shadow-sm); opacity: 0; transition: opacity 0.3s;}
    .timer-pill.visible{opacity: 1;}
    .timer-text{font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;color:var(--forest);white-space:nowrap;}

    .mode-switch{display:flex;background:#e2d4b0;border-radius:99px;padding:3px;gap:3px;}
    .mode-btn{padding:7px 14px;border:none;border-radius:99px;background:transparent;font-family:'Space Mono',monospace;font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);cursor:pointer;transition:all .2s var(--ease);}
    .mode-btn.active{background:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);}

    .view{display:none;flex-direction:column;gap:14px; padding-bottom: 20px;}
    .view.active{display:flex;}

    /* ═══════ STUDY MODE ═══════ */
    .study-card{background:var(--card);border:1.5px solid var(--card-line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;}
    .study-card-num{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em;}
    .triple-toggle{display:flex;background:#e9dcbb;border-radius:99px;padding:3px;gap:3px;}
    .triple-btn{flex:1;padding:8px 6px;border:none;border-radius:99px;background:transparent;font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-muted);cursor:pointer;transition:all .2s var(--ease);text-align:center;}
    .triple-btn.active[data-deg="pos"]{background:var(--pos);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);}
    .triple-btn.active[data-deg="comp"]{background:var(--comp);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);}
    .triple-btn.active[data-deg="sup"]{background:var(--sup);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);}
    .study-sentence{font-family:'Fraunces',serif;font-size:1.08rem;line-height:1.6;text-align:center;color:var(--ink);min-height:2.6em;display:flex;align-items:center;justify-content:center;padding:6px 4px;}
    .degree-pill{align-self:center;font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.05em;padding:4px 12px;border-radius:99px;color:#fff;text-transform:uppercase;}
    .degree-pill.pos{background:var(--pos);}
    .degree-pill.comp{background:var(--comp);}
    .degree-pill.sup{background:var(--sup);}

    /* ═══════ QUIZ MODE (Tile Building) ═══════ */
    .quiz-stats{background:var(--card);border:1.5px solid var(--card-line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;}
    .quiz-stats-top{display:flex;justify-content:space-between;align-items:baseline;font-family:'Space Mono',monospace;font-size:.68rem;color:var(--ink-muted);text-transform: uppercase; font-weight: 700;}
    .quiz-stats-top b{color:var(--clay);font-size:1.15em;margin:0 2px;}
    .quiz-track{height:6px;background:#e9dcbb;border-radius:99px;overflow:hidden;}
    .quiz-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--forest));border-radius:99px;transition:width .5s var(--ease);}

    .contrast-card{
      background:#faf5e6;border:1.5px solid #ecdfb9;border-radius:12px;padding:12px 14px;
      display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 3px rgba(45,38,32,.04);
    }
    .contrast-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
    .contrast-title{font-family:'Space Mono',monospace;font-size:.6rem;text-transform:uppercase;color:var(--clay);font-weight:700;letter-spacing:.05em;}
    .toggle-wrap{display:flex;background:#e2d4b0;border-radius:99px;padding:2px;gap:2px;}
    .toggle-btn{
      padding:6px 12px;border:none;border-radius:99px;background:transparent;
      font-family:'Space Mono',monospace;font-size:.64rem;font-weight:700;color:var(--ink-muted);
      cursor:pointer;transition:all .2s var(--ease);
    }
    .toggle-btn.active{background:var(--forest);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);}
    .toggle-btn.done{color: var(--moss); background: rgba(111,143,90,.15); font-style: italic;}
    .toggle-btn.active.done{background:var(--forest);color:#fff; font-style: normal;}

    .mount{background:var(--card);border:1.5px solid var(--card-line);border-radius:14px;padding:20px 15px 16px;box-shadow:var(--shadow-md);position:relative; min-height: 120px;}
    .mount::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:1px dashed #d8c69a;border-radius:8px;pointer-events:none;}
    .mount.error{animation:shake .35s ease;}
    .mount.success{animation:pop .4s var(--ease);}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}

    .slots{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 6px;justify-content:center;min-height:40px;position:relative;z-index:1;}
    .slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:30px;}
    .slot .word{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;color:var(--forest);}
    .slot .dash{width:100%;min-width:32px;border-bottom:2px dashed #c9b98d;height:1.3rem;}
    .slot.filled{animation:tileIn .25s cubic-bezier(.2,1.5,.4,1);}
    @keyframes tileIn{from{transform:translateY(6px) scale(.85);opacity:0}to{transform:none;opacity:1}}
    
    .mount-caption{text-align:center;font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-muted);margin-top:14px;letter-spacing:.03em;position:relative;z-index:1;text-transform:uppercase;}

    .tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;align-content:flex-start;}
    .tile{
      display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:10px;
      background:#fffdf7;border:1.5px solid var(--card-line);cursor:pointer;user-select:none;
      box-shadow:var(--shadow-sm);transition:transform .15s var(--ease),box-shadow .15s,visibility 0s,opacity .15s;
      animation:tileSpawn .22s cubic-bezier(.2,1.5,.4,1);
      font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--ink);
    }
    .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
    .tile:active{transform:scale(.94);}
    .tile.wrong{animation:tileShake .4s ease; background: #ffeae8; border-color: var(--rust); color: var(--rust);}
    .tile.used{visibility:hidden;pointer-events:none;}
    @keyframes tileShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @keyframes tileSpawn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

    /* ═══════ END SCREEN ═══════ */
    .end-card{background:var(--card);border:1.5px solid var(--card-line);border-radius:20px;padding:32px 26px;box-shadow:0 20px 60px rgba(45,38,32,.14);display:flex;flex-direction:column;gap:16px;animation:cardIn .55s cubic-bezier(.34,1.4,.64,1) forwards; max-width: 440px; margin: 0 auto; width: 100%;}
    @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
    .end-title{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:900;text-align:center;color:var(--forest);}
    .end-subtitle{text-align:center;font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-muted);letter-spacing:.06em;text-transform:uppercase;}
    .end-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin: 10px 0;}
    .stat-box{background:var(--paper);border-radius:12px;padding:16px 8px;text-align:center;border:1.5px solid var(--card-line);}
    .stat-num{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;color:var(--forest);line-height:1;}
    .stat-lbl{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
    .btn-again{padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--forest),var(--moss));color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(47,82,51,.25); transition:transform .15s;}
    .btn-again:active{transform:scale(.97);}

    .toast{
      position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
      padding:9px 20px;border-radius:16px;font-size:.83rem;font-weight:500;z-index:200;pointer-events:none;
      transition:transform .35s var(--ease),opacity .35s;opacity:0;max-width:90vw;text-align:center;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    .toast.good{background:linear-gradient(135deg,var(--forest),var(--moss));}
    .toast.bad{background:linear-gradient(135deg,var(--rust),#c0503f);}
  </style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ═══════ Name / Department Gate ═══════ -->
<div class="screen active" id="nameForm">
  <div class="gate-card">
    <div class="hero-quote">
      <div class="hero-text">Degrees of Comparison</div>
      <div class="hero-author">Triple Toggle ✦</div>
    </div>
    <div class="gate-label">Your Name</div>
    <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off"/>
    <div class="gate-label">Department</div>
    <select id="departmentSelect">
      <option value="">-- Select Department --</option>
      <option value="Cyber Security">Cyber Security</option>
      <option value="EIE">EIE</option>
      <option value="CSE-1">CSE-1</option>
      <option value="CSE-2">CSE-2</option>
      <option value="CSE-3">CSE-3</option>
      <option value="Mechanical Engineering">Mechanical Engineering</option>
      <option value="ECE-1">ECE-1</option>
      <option value="ECE-2">ECE-2</option>
      <option value="ECE-3">ECE-3</option>
      <option value="AI DS-1">AI DS-1</option>
      <option value="AI DS-2">AI DS-2</option>
      <option value="Agri and Civil">Agri and Civil</option>
      <option value="EEE">EEE</option>
      <option value="Medical Electronics">Medical Electronics</option>
      <option value="IT-1">IT-1</option>
      <option value="IT-2">IT-2</option>
    </select>
    <div id="gateError"></div>
    <button class="btn-start" onclick="beginApp()">✿ Enter Application</button>
  </div>
</div>

<!-- ═══════ Main Application Screen ═══════ -->
<div class="screen" id="mainScreen">
  <div class="col">
    <div class="top-bar">
      <div class="brand"><h1>Degrees<span>✦</span></h1><div class="sub">Study & Test</div></div>
      <div class="timer-pill" id="timerPill"><div class="timer-text" id="timerText">00:00</div></div>
      <div class="mode-switch">
        <button class="mode-btn active" id="btnStudyMode">Guide</button>
        <button class="mode-btn" id="btnQuizMode">Test</button>
      </div>
    </div>

    <!-- ═══════ STUDY VIEW ═══════ -->
    <div class="view active" id="studyView"></div>

    <!-- ═══════ QUIZ VIEW ═══════ -->
    <div class="view" id="quizView">
      <div class="quiz-stats">
        <div class="quiz-stats-top">
          <span>Score <b id="qScore">0</b></span>
          <span>Streak <b id="qStreak">0</b></span>
          <span>Subject <b id="qProgress">0</b>/<b id="qTotal">10</b></span>
        </div>
        <div class="quiz-track"><div class="quiz-fill" id="qFill" style="width:0%"></div></div>
      </div>

      <div class="contrast-card" id="contrast-card">
        <div class="contrast-header">
          <span class="contrast-title">Same Subject, Across Degrees</span>
          <div class="toggle-wrap" id="toggle-wrap">
            <button class="toggle-btn" data-deg="pos" data-label="Positive" onclick="loadDegreeUI('pos')">Positive</button>
            <button class="toggle-btn" data-deg="comp" data-label="Comparative" onclick="loadDegreeUI('comp')">Comparative</button>
            <button class="toggle-btn" data-deg="sup" data-label="Superlative" onclick="loadDegreeUI('sup')">Superlative</button>
          </div>
        </div>
      </div>

      <div class="mount" id="mount">
        <div class="slots" id="slots"></div>
        <div class="mount-caption" id="mount-caption">tap the missing words to construct the degree</div>
      </div>

      <div class="tray" id="tray"></div>
    </div>
  </div>
</div>

<!-- ═══════ END SCREEN ═══════ -->
<div class="screen" id="endScreen">
  <div class="col" style="align-items: center; justify-content: center; min-height: 80vh;">
    <div class="end-card">
      <div class="end-title" id="endTitle">🎯 Test Complete!</div>
      <div class="end-subtitle" id="endSubtitle">Degrees of Comparison</div>
      <div class="end-stats">
        <div class="stat-box"><div class="stat-num" id="endScore">0</div><div class="stat-lbl">Score</div></div>
        <div class="stat-box"><div class="stat-num" id="endAccuracy">0%</div><div class="stat-lbl">Accuracy</div></div>
      </div>
      <button class="btn-again" id="btnPlayAgain">✿ Return to Study</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   DATA — 10 subjects, each with a Positive / Comparative /
   Superlative sentence about the same idea. 
   ═══════════════════════════════════════════════════════════════ */
const SUBJECTS = [
  { pos:"Mount Everest is a tall mountain.", comp:"Mount Everest is taller than other mountains in the world.", sup:"Mount Everest is the highest mountain in the world." },
  { pos:"Rahul is a tall person.", comp:"Rahul is taller than Mohan.", sup:"Rahul is the tallest person in the group." },
  { pos:"This laptop is a cheap laptop.", comp:"This laptop is cheaper than that laptop.", sup:"This laptop is the cheapest laptop in the shop." },
  { pos:"Health is a valuable thing.", comp:"Health is more valuable than wealth.", sup:"Health is the most valuable thing in life." },
  { pos:"Iron is a useful metal.", comp:"Iron is more useful than other metals.", sup:"Iron is the most useful metal." },
  { pos:"Mumbai is a crowded city in India.", comp:"Mumbai is more crowded than most other cities in India.", sup:"Mumbai is one of the most crowded cities in India." },
  { pos:"The Nile is a long river in Africa.", comp:"The Nile is longer than any other river in Africa.", sup:"The Nile is the longest river in Africa." },
  { pos:"This novel is an interesting one.", comp:"This novel is more interesting than any other novel I have read.", sup:"This is the most interesting novel I have ever read." },
  { pos:"Anita is a talented singer in the class.", comp:"Anita is more talented than any other singer in the class.", sup:"Anita is the most talented singer in the class." },
  { pos:"Python is a popular programming language.", comp:"Python is more popular than any other programming language.", sup:"Python is the most popular programming language." }
];

const DEGREE_LABEL = { pos:"Positive Degree", comp:"Comparative Degree", sup:"Superlative Degree" };

/* ═══════════════════════ STATE & SUPABASE ═══════════════════════ */
const EDGE_FUNCTION_URL = "https://yellow-lab-4999.andrewveda.workers.dev/functions/v1/logQuest";
let playerName = '';
let playerDept = '';

let quizDeck = [];
let currentSubjectIdx = 0;
let currentDegree = 'pos';
let degreeStatus = { pos: false, comp: false, sup: false };
let currentSubjectMistake = false; // Tracks if they made a mistake on the CURRENT attempt

let targetWords = [];
let placedCount = 0;
let trayTiles = [];

let quizScore = 0, quizStreak = 0, quizCorrect = 0, quizWrong = 0;
let elapsedSeconds = 0;
let timerInterval = null;
let isQuizActive = false;

/* ═══════════════ AUTO LOGIN / GATE ═══════════════ */
document.addEventListener("DOMContentLoaded", () => {
  const savedName = localStorage.getItem("userName");
  const savedDept = localStorage.getItem("userDept");
  if (savedName) document.getElementById("nameInput").value = savedName;
  if (savedDept) document.getElementById("departmentSelect").value = savedDept;

  if (savedName && savedDept) {
    playerName = savedName;
    playerDept = savedDept;
    document.getElementById("nameForm").classList.remove("active");
    document.getElementById("mainScreen").classList.add("active");
    renderStudyView();
  }
});

function beginApp() {
  const nameEl = document.getElementById('nameInput');
  const deptEl = document.getElementById('departmentSelect');
  const errEl = document.getElementById('gateError');

  const name = nameEl.value.trim();
  const dept = deptEl.value;

  if (!name) { errEl.textContent = 'Please enter your name.'; nameEl.focus(); return; }
  if (!dept) { errEl.textContent = 'Please select your department.'; deptEl.focus(); return; }

  errEl.textContent = '';
  playerName = name;
  playerDept = dept;
  localStorage.setItem("userName", name);
  localStorage.setItem("userDept", dept);

  document.getElementById('nameForm').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  renderStudyView();
}

/* ═══════════════════════ STUDY MODE ═══════════════════════ */
function renderStudyView(){
  const wrap = document.getElementById('studyView');
  wrap.innerHTML = SUBJECTS.map((s,i)=>`
    <div class="study-card" data-idx="${i}">
      <div class="study-card-num">Subject ${i+1} / ${SUBJECTS.length}</div>
      <div class="triple-toggle">
        <button class="triple-btn active" data-deg="pos" onclick="setStudyDegree(${i},'pos',this)">Positive</button>
        <button class="triple-btn" data-deg="comp" onclick="setStudyDegree(${i},'comp',this)">Comparative</button>
        <button class="triple-btn" data-deg="sup" onclick="setStudyDegree(${i},'sup',this)">Superlative</button>
      </div>
      <div class="study-sentence" id="study-sentence-${i}">${SUBJECTS[i].pos}</div>
      <span class="degree-pill pos" id="study-pill-${i}">Positive Degree</span>
    </div>
  `).join('');
}

function setStudyDegree(idx, deg, btnEl){
  const card = btnEl.closest('.study-card');
  card.querySelectorAll('.triple-btn').forEach(b=>b.classList.toggle('active', b.dataset.deg===deg));
  document.getElementById(`study-sentence-${idx}`).textContent = SUBJECTS[idx][deg];
  const pill = document.getElementById(`study-pill-${idx}`);
  pill.textContent = DEGREE_LABEL[deg];
  pill.className = 'degree-pill ' + deg;
}
window.setStudyDegree = setStudyDegree;

/* ═══════════════════════ QUIZ MODE ═══════════════════════ */
function startQuiz(){
  // Create shuffled deck of subject indices
  quizDeck = SUBJECTS.map((_, i) => i);
  for(let i = quizDeck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [quizDeck[i], quizDeck[j]] = [quizDeck[j], quizDeck[i]];
  }

  currentSubjectIdx = 0; 
  quizScore = 0; quizStreak = 0; quizCorrect = 0; quizWrong = 0;
  elapsedSeconds = 0;
  isQuizActive = true;
  document.getElementById('timerPill').classList.add('visible');
  
  clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if(!isQuizActive) return;
    elapsedSeconds++;
    updateTimerDisplay();
  }, 1000);

  loadSubject();
}

function updateTimerDisplay(){
  const m = Math.floor(elapsedSeconds / 60);
  const s = elapsedSeconds % 60;
  document.getElementById('timerText').textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

function updateQuizStats(){
  document.getElementById('qScore').textContent = quizScore;
  document.getElementById('qStreak').textContent = quizStreak;
  document.getElementById('qProgress').textContent = currentSubjectIdx;
  document.getElementById('qTotal').textContent = quizDeck.length; // Reflects total deck size (including repeats)
  
  // Fill is based on how many subjects they have passed out of the total deck size
  document.getElementById('qFill').style.width = (currentSubjectIdx / quizDeck.length * 100) + '%';
}

function loadSubject() {
  currentSubjectMistake = false; // Reset mistake flag for this fresh attempt
  updateQuizStats();
  degreeStatus = { pos: false, comp: false, sup: false };
  
  // Reset Toggle UI visual states
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.remove('done', 'active');
    b.textContent = b.dataset.label;
  });

  loadDegreeUI('pos');
}

function loadDegreeUI(deg) {
  currentDegree = deg;
  
  // Update Toggles
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.deg === deg);
  });

  const rawSentence = SUBJECTS[quizDeck[currentSubjectIdx]][deg];
  targetWords = rawSentence.split(' ');
  placedCount = 0;

  if (degreeStatus[deg]) {
    // Already Completed
    placedCount = targetWords.length;
    renderSlots();
    document.getElementById('tray').innerHTML = '';
    document.getElementById('mount-caption').textContent = 'Degree completed';
  } else {
    // Generate Tiles
    trayTiles = targetWords.map((word, i) => ({ id: i, word: word, used: false }));
    
    // Shuffle Tray
    for (let i = trayTiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [trayTiles[i], trayTiles[j]] = [trayTiles[j], trayTiles[i]];
    }
    
    renderSlots();
    renderTray();
    document.getElementById('mount-caption').textContent = `tap the ${targetWords.length} tiles to construct the sentence`;
  }
}

function renderSlots() {
  const wrap = document.getElementById('slots');
  wrap.innerHTML = '';
  targetWords.forEach((word, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (i < placedCount ? ' filled' : '');
    if (i < placedCount) {
      slot.innerHTML = `<span class="word">${word}</span>`;
    } else {
      slot.innerHTML = `<span class="dash"></span>`;
    }
    wrap.appendChild(slot);
  });
}

function renderTray() {
  const wrap = document.getElementById('tray');
  wrap.innerHTML = '';
  trayTiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tile' + (t.used ? ' used' : '');
    el.innerHTML = `<span class="word">${t.word}</span>`;
    el.onclick = () => tapTile(t.id, el);
    wrap.appendChild(el);
  });
}

function tapTile(id, el) {
  if (!isQuizActive || degreeStatus[currentDegree]) return;
  const tile = trayTiles.find(t => t.id === id);
  if (!tile || tile.used) return;

  // Accept ANY tile that matches the expected word string
  if (tile.word === targetWords[placedCount]) {
    // Correct Action
    tile.used = true;
    el.classList.add('used');
    placedCount++;
    quizCorrect++;
    quizStreak++;
    
    // Calculate points (Base 5 + Streak bonus up to +5)
    quizScore += 5 + Math.min(quizStreak, 5); 
    
    renderSlots();

    if (placedCount >= targetWords.length) {
      completeDegree();
    }
  } else {
    // Wrong Action
    quizWrong++;
    quizStreak = 0;
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
    const mount = document.getElementById('mount');
    mount.classList.add('error');
    setTimeout(() => mount.classList.remove('error'), 350);
    if (navigator.vibrate) navigator.vibrate(15);
    
    // Spaced Repetition mechanic: Append subject to the end of the deck on first mistake
    if (!currentSubjectMistake) {
      currentSubjectMistake = true;
      quizDeck.push(quizDeck[currentSubjectIdx]); 
    }
  }
  
  // Call immediately to update counters and progress bar (denominators will rise on mistake)
  updateQuizStats(); 
}

function completeDegree() {
  degreeStatus[currentDegree] = true;
  document.getElementById('mount').classList.add('success');
  setTimeout(() => document.getElementById('mount').classList.remove('success'), 650);
  showToast('Degree built!', 'good');

  const btn = document.querySelector(`.toggle-btn[data-deg="${currentDegree}"]`);
  if (btn) {
    btn.classList.add('done');
    btn.textContent = btn.dataset.label + ' ✓';
  }

  // Check if all 3 degrees are completed for this attempt
  if (degreeStatus.pos && degreeStatus.comp && degreeStatus.sup) {
    setTimeout(() => {
      currentSubjectIdx++;
      if (currentSubjectIdx >= quizDeck.length) {
        updateQuizStats();
        endQuiz();
      } else {
        showToast('Moving to next Subject', 'good');
        loadSubject();
      }
    }, 1200);
  } else {
    // Auto-advance to the next incomplete degree to keep momentum
    setTimeout(() => {
      if (!degreeStatus.pos) loadDegreeUI('pos');
      else if (!degreeStatus.comp) loadDegreeUI('comp');
      else if (!degreeStatus.sup) loadDegreeUI('sup');
    }, 1000);
  }
}

function endQuiz(){
  isQuizActive = false;
  clearInterval(timerInterval);
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('endScreen').classList.add('active');
  
  document.getElementById('endSubtitle').textContent = `${playerName} · ${playerDept}`;
  document.getElementById('endScore').textContent = quizScore;
  const total = quizCorrect + quizWrong;
  const pct = total ? quizCorrect/total : 0;
  document.getElementById('endAccuracy').textContent = Math.round(pct*100)+'%';
  document.getElementById('endTitle').textContent = pct === 1 ? '🏆 Perfect Score!' : pct >= 0.8 ? '🎯 Great Work!' : pct >= 0.5 ? '📈 Good Effort!' : '📖 Keep Practicing!';
  
  // Submit EXACTLY once after all subjects (including repeats) are complete
  submitSpecimenToSupabase();
}

/* ═══════════════ SUPABASE LOGGING ═══════════════ */
async function submitSpecimenToSupabase(){
  const payload = {
    student_name: playerName,
    department: playerDept,
    correct: quizCorrect,
    wrong: quizWrong,
    time_spent: elapsedSeconds,
    quest_id: "Quest 18",
    score: quizScore,
    sentences_pressed: quizDeck.length * 3 // Dynamically scales with repeats
  };

  try {
    const response = await fetch(EDGE_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!response.ok) { console.error("❌ Edge Function Error:", await response.text()); return; }
    console.log("✅ Saved to Supabase");
  } catch (err) { 
    console.error("⚠️ Edge Function Error:", err); 
  }
}

/* ═══════════════════════ NAVIGATION ═══════════════════════ */
document.getElementById('btnPlayAgain').addEventListener('click', ()=>{
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  document.getElementById('btnStudyMode').click();
});

document.getElementById('btnStudyMode').addEventListener('click', ()=>{
  if(isQuizActive && !confirm("Leave the current test? Your progress will be lost.")) return;
  isQuizActive = false;
  clearInterval(timerInterval);
  document.getElementById('timerPill').classList.remove('visible');

  document.getElementById('btnStudyMode').classList.add('active');
  document.getElementById('btnQuizMode').classList.remove('active');
  document.getElementById('studyView').classList.add('active');
  document.getElementById('quizView').classList.remove('active');
});

document.getElementById('btnQuizMode').addEventListener('click', ()=>{
  if(isQuizActive) return; 
  document.getElementById('btnQuizMode').classList.add('active');
  document.getElementById('btnStudyMode').classList.remove('active');
  document.getElementById('quizView').classList.add('active');
  document.getElementById('studyView').classList.remove('active');
  startQuiz();
});

/* ═══════════════════════ TOAST ═══════════════════════ */
let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
}
</script>
