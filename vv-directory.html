<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lexicon — Vox Velocity Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#C9A84C; --gold-light:#E8C97A; --gold-pale:#F5E6B8;
    --gold-dim:rgba(201,168,76,0.12);
    --bg-body:#1a1208; --dark:#1a1208; --dark-mid:#2d2010; --dark-warm:#3d2e12;
    --surface:rgba(201,168,76,0.05); --surface2:rgba(201,168,76,0.09);
    --card-bg:linear-gradient(160deg,#3d2e12,#1a1208);
    --text-main:#F9F3E3; --ash:rgba(249,243,227,0.38); --ash2:rgba(249,243,227,0.18);
    --danger:#8B2020; --danger-light:#c43030;
    --border:rgba(201,168,76,0.22); --border-dim:rgba(255,255,255,0.06);
    --key-bg:rgba(201,168,76,0.07); --key-border:rgba(201,168,76,0.35); --key-color:#E8C97A;
    --key-correct-bg:rgba(45,90,39,0.35); --key-correct-border:rgba(100,180,80,0.45); --key-correct-color:rgba(130,220,100,0.9);
    --key-wrong-bg:rgba(100,20,20,0.35); --key-wrong-border:rgba(150,40,40,0.35); --key-wrong-color:rgba(180,80,80,0.5);
    --def-bg:rgba(201,168,76,0.04); --def-border:rgba(201,168,76,0.18);
    --wrong-color:rgba(200,70,70,0.85); --pattern-op:0.025;
    --emerald:#3a8f6a;
  }
  html.light {
    --gold:#9a6e00; --gold-light:#b88a00; --gold-pale:#5a3d00;
    --gold-dim:rgba(154,110,0,0.14);
    --bg-body:#faf4e8; --dark:#faf4e8; --dark-mid:#f0e8d0; --dark-warm:#e8dcc0;
    --surface:rgba(154,110,0,0.06); --surface2:rgba(154,110,0,0.10);
    --card-bg:linear-gradient(160deg,#ede0c0,#faf4e8);
    --text-main:#3a2800; --ash:rgba(58,40,0,0.45); --ash2:rgba(58,40,0,0.18);
    --border:rgba(154,110,0,0.28); --border-dim:rgba(0,0,0,0.07);
    --def-bg:rgba(154,110,0,0.06); --def-border:rgba(154,110,0,0.22);
    --emerald:#2a7a58;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg-body);font-family:'Cormorant Garamond',serif;color:var(--text-main);overflow:hidden;}
  body{height:100dvh;display:flex;flex-direction:column;position:relative;}

  .app-view{display:none;flex-direction:column;height:100%;width:100%;position:relative;z-index:2;overflow:hidden;}
  .app-view.active{display:flex;}

  /* ── DIRECTORY UI ── */
  .dir-chrome{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;flex-shrink:0;border-bottom:1px solid var(--border);}
  .wordmark{font-family:'Playfair Display',serif;font-size:16px;letter-spacing:.18em;color:var(--gold-light);}
  .dir-sections{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 24px;}
  .dir-section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px;border-bottom:1px solid var(--border);margin-top:8px;}
  .dir-section-name{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
  
  .pack-container{border-bottom:1px solid var(--border-dim);}
  .pack-row{display:flex;align-items:center;gap:12px;padding:12px 10px;cursor:pointer;transition:background .2s;}
  .pack-row:hover{background:var(--surface2);}
  .pack-icon{font-size:18px;width:24px;text-align:center;}
  .pack-info{flex:1;min-width:0;}
  .pack-name{font-family:'Playfair Display',serif;font-size:15px;color:var(--text-main);}
  .pack-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--ash);margin-top:2px;}
  .pack-actions{display:flex;align-items:center;gap:6px;}
  
  .study-btn{background:var(--surface);border:1px solid var(--border);color:var(--gold);font-family:'DM Mono',monospace;font-size:9px;padding:4px 8px;border-radius:6px;cursor:pointer;text-transform:uppercase;}
  .play-btn{background:linear-gradient(135deg,var(--gold),#a07828);color:#1a1208;border:none;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;padding:5px 10px;border-radius:6px;cursor:pointer;text-transform:uppercase;}

  /* ── PRE-GAME STUDY DRAWER ── */
  .study-drawer{display:none;background:var(--def-bg);border:1px solid var(--def-border);border-radius:8px;margin:4px 10px 12px;padding:12px;}
  .study-drawer.show{display:block;}
  .study-card{border-bottom:1px solid var(--border-dim);padding-bottom:10px;margin-bottom:10px;}
  .study-card:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .study-head{display:flex;align-items:center;justify-content:space-between;}
  .study-word{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold-light);}
  .study-speak-btn{background:none;border:1px solid var(--border);border-radius:50%;width:26px;height:26px;color:var(--gold);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .study-def{font-style:italic;font-size:14px;color:var(--text-main);opacity:.9;margin:4px 0 6px;}
  .study-ctx{background:var(--surface);border-radius:6px;padding:6px 8px;font-size:12px;}
  .study-speaker{font-family:'DM Mono',monospace;font-size:8px;text-transform:uppercase;color:var(--gold);margin-right:4px;}

  /* ── GAME ENGINE ── */
  header{text-align:center;padding:6px 16px 5px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
  h1{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold-light);}
  main{flex:1;display:flex;flex-direction:column;padding:8px 12px;gap:7px;max-width:480px;margin:0 auto;width:100%;overflow:hidden;}
  .dialogue-card{background:var(--def-bg);border:1px solid var(--def-border);border-radius:14px;padding:14px 16px;}
  .dial-definition{font-style:italic;font-size:15px;margin-bottom:8px;}
  .keyboard{display:flex;flex-direction:column;gap:5px;}
  .kb-row{display:flex;justify-content:center;gap:4px;}
  .kb-key{flex:1;height:42px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--gold);font-family:'Playfair Display',serif;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div id="waterOverlay"></div>

<!-- DIRECTORY VIEW -->
<div class="app-view active" id="viewDirectory">
  <div class="dir-chrome">
    <span class="wordmark">VOX VELOCITY</span>
    <button onclick="toggleTheme()" style="background:none;border:none;cursor:pointer;font-size:16px;">☀️</button>
  </div>

  <div class="dir-sections" id="dirSectionsContainer">
    <!-- Rendered Dynamically from words.js -->
  </div>
</div>

<!-- GAME VIEW -->
<div class="app-view" id="viewGame">
  <header>
    <button onclick="showDirectoryView()" style="position:absolute;left:10px;background:none;border:none;color:var(--gold);font-size:18px;cursor:pointer;">🏠</button>
    <h1>Lexicon</h1>
  </header>
  <main>
    <div class="dialogue-card">
      <div id="catTag" style="font-family:'DM Mono',monospace;font-size:8px;color:var(--gold);"></div>
      <div id="gameDefinition" class="dial-definition"></div>
      <div id="dialLines"></div>
    </div>
    <div id="wrongLetters" style="text-align:center;font-family:'DM Mono',monospace;min-height:18px;"></div>
    <div class="keyboard" id="keyboard"></div>
  </main>
</div>

<script type="module">
import { VOCAB_PACKS } from "./words.js";

let activeWordPool = [];
let currentWord, guessed = new Set();

// ── DIRECTORY & STUDY PREVIEW RENDER ──
function renderDirectory() {
  const container = document.getElementById('dirSectionsContainer');
  container.innerHTML = '';

  const categories = [...new Set(VOCAB_PACKS.map(p => p.category))];

  categories.forEach(cat => {
    const packsInCat = VOCAB_PACKS.filter(p => p.category === cat);
    const catSection = document.createElement('div');
    catSection.className = 'dir-section';
    
    catSection.innerHTML = `
      <div class="dir-section-head">
        <span class="dir-section-name">${cat}</span>
        <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--ash);">${packsInCat.length} Packs</span>
      </div>`;

    packsInCat.forEach(pack => {
      const packBox = document.createElement('div');
      packBox.className = 'pack-container';

      // Build Study Drawer HTML
      const studyCardsHtml = pack.words.map(w => {
        const lines = (w.dialogue || []).map(d => `<div><span class="study-speaker">${d.s}:</span> ${d.t}</div>`).join('');
        return `
          <div class="study-card">
            <div class="study-head">
              <span class="study-word">${w.phrase}</span>
              <button class="study-speak-btn" onclick="speakText('${w.phrase}. ${w.hint}')">🔊</button>
            </div>
            <div class="study-def">${w.hint}</div>
            ${lines ? `<div class="study-ctx">${lines}</div>` : ''}
          </div>`;
      }).join('');

      packBox.innerHTML = `
        <div class="pack-row">
          <span class="pack-icon">${pack.icon}</span>
          <div class="pack-info">
            <div class="pack-name">${pack.name}</div>
            <div class="pack-sub">${pack.sub} · ${pack.words.length} words</div>
          </div>
          <div class="pack-actions">
            <button class="study-btn" onclick="toggleStudyDrawer('${pack.id}')">📖 Study</button>
            <button class="play-btn" onclick="launchPack('${pack.id}')">▶ Play</button>
          </div>
        </div>
        <div class="study-drawer" id="drawer-${pack.id}">
          ${studyCardsHtml}
        </div>`;

      catSection.appendChild(packBox);
    });

    container.appendChild(catSection);
  });
}

window.toggleStudyDrawer = function(packId) {
  const drawer = document.getElementById(`drawer-${packId}`);
  if (drawer) drawer.classList.toggle('show');
};

// ── AUDIO PRONUNCIATION (en-GB) ──
window.speakText = function(text) {
  if (!('speechSynthesis' in window)) return alert('Text-to-Speech not supported.');
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-GB';
  utter.rate = 0.9;
  
  const voices = window.speechSynthesis.getVoices();
  const ukVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK') || v.name.includes('British'));
  if (ukVoice) utter.voice = ukVoice;
  
  window.speechSynthesis.speak(utter);
};

// ── GAME LAUNCH ──
window.launchPack = function(packId) {
  const pack = VOCAB_PACKS.find(p => p.id === packId);
  if (!pack || !pack.words.length) return;
  activeWordPool = pack.words;
  document.getElementById('viewDirectory').classList.remove('active');
  document.getElementById('viewGame').classList.add('active');
  startGame();
};

window.showDirectoryView = function() {
  document.getElementById('viewGame').classList.remove('active');
  document.getElementById('viewDirectory').classList.add('active');
};

function startGame() {
  currentWord = activeWordPool[Math.floor(Math.random() * activeWordPool.length)];
  guessed = new Set();
  document.getElementById('catTag').textContent = currentWord.theme;
  document.getElementById('gameDefinition').textContent = currentWord.hint;
  renderPuzzle();
  buildKeyboard();
}

function renderPuzzle() {
  const container = document.getElementById('dialLines');
  container.innerHTML = '';
  (currentWord.dialogue || []).forEach(line => {
    const row = document.createElement('div');
    row.style.margin = '4px 0';
    const hiddenText = line.t.replace(new RegExp(currentWord.phrase, 'gi'), matched => {
      return matched.split('').map(c => guessed.has(c.toUpperCase()) || c === ' ' ? c : '_').join('');
    });
    row.innerHTML = `<strong style="font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);">${line.s}:</strong> ${hiddenText}`;
    container.appendChild(row);
  });
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard'); kb.innerHTML = '';
  ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach(rowStr => {
    const div = document.createElement('div'); div.className = 'kb-row';
    rowStr.split('').forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'kb-key'; btn.textContent = letter;
      btn.onclick = () => {
        guessed.add(letter);
        btn.disabled = true;
        btn.style.opacity = '0.4';
        renderPuzzle();
      };
      div.appendChild(btn);
    });
    kb.appendChild(div);
  });
}

window.toggleTheme = function() { document.documentElement.classList.toggle('light'); };

// Init
renderDirectory();
</script>
</body>
</html>
